  }

  function readFile(input, cb) {
    const f = input.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => cb(parseSpectrumFile(f.name, String(fr.result)) || { name: f.name, bad: true });
    fr.readAsText(f);
  }

  function renderMatch() {
    const box = $("matchPanel");
    if (state.method !== "MATCH") return;
    const d = mt.data;
    const edges = Object.keys(mt.index || {}).filter(k => k.startsWith((state.el || "") + "_")).map(k => k.split("_")[1]);
    const opt = (v, label, cur) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(label)}</option>`;
    let h = `<h2>${esc(t("mTitle"))}</h2>`;
    if (!state.el) { box.innerHTML = h + `<p class="status">${esc(t("mPick"))}</p>`; return; }
    const crystals = d ? [...new Set(d.items.map(i => i.c).filter(Boolean))].sort() : [];
    const scopes = d ? [...new Set(d.items.map(i => i.db === "MDR" ? `MDR|${i.fac}` : i.db))] : [];
    h += `<div class="mform">
      <div><label>${esc(t("mEdge"))}</label><select id="mEdge">${edges.map(e => opt(e, `${state.el} ${e} (${mt.index[`${state.el}_${e}`]})`, mt.edge)).join("")}</select></div>
      <div><label>${esc(t("mScope"))}</label><select id="mScope">${opt("", t("mScopeAll"), mt.scope)}${scopes.map(v => opt(v, v.startsWith("MDR|") ? `MDR: ${facShort(v.slice(4)) || v.slice(4)}` : dbName(v), mt.scope)).join("")}</select></div>
      <div><label>${esc(t("mCrystal"))}</label><select id="mCrystal">${opt("", t("mAny"), mt.crystal)}${crystals.map(c => opt(c, c, mt.crystal)).join("")}</select></div>
      <div><label>${esc(t("mTop"))}</label><select id="mTop">${[5, 10, 20, 50].map(n => opt(String(n), String(n), String(mt.top))).join("")}</select></div>
    </div>`;
    if (mt.err && !mt.results) h += `<p class="status err">${esc(mt.err)}</p>`;
    if (!d) { box.innerHTML = h + `<p class="status">${esc(t("loading"))}</p>`; bindMatch(); return; }
    // 測定データ
    const loaded = p => { if (!p) return ""; if (p.bad) return `<p class="status err">${esc(t("mParseFail", { name: p.name }))}</p>`;
      const sr = seriesOf(p); return sr && sr.x.length ? `<p class="hint">${esc(t("mLoaded", { name: p.name, n: sr.x.length, lo: sr.x[0].toFixed(1), hi: sr.x[sr.x.length - 1].toFixed(1) }))}</p>` : ""; };
    const colSel = (id, cur, names) => `<select id="${id}">${names.map((n, i) => opt(String(i), n, String(cur))).join("")}</select>`;
    const p = mt.sample && !mt.sample.bad && mt.sample.kind === "table" ? mt.sample : null;
    h += `<div class="mstep"><h3>${esc(t("mSample"))}</h3><p class="hint" style="margin:0 0 4px">${esc(t("mSampleHint"))}</p>
      <input type="file" id="mSampleFile">${loaded(mt.sample)}
      ${p ? `<div class="mcols">${esc(t("mCols"))} ${esc(t("mColE"))} ${colSel("mColE", mt.cfg.e, p.names)}
        ${esc(t("mColY"))} <select id="mMode">${opt("col", t("mYcol"), mt.cfg.mode)}${opt("ln", t("mYln"), mt.cfg.mode)}${opt("ratio", t("mYratio"), mt.cfg.mode)}</select>
        ${mt.cfg.mode === "col" ? colSel("mColY", mt.cfg.y, p.names) : `A ${colSel("mColA", mt.cfg.a, p.names)} B ${colSel("mColB", mt.cfg.b, p.names)}`}</div>` : ""}</div>`;
    // リファレンス
    const off = currentOffset();
    h += `<div class="mstep"><h3>${esc(t("mRef"))}</h3><p class="hint" style="margin:0 0 4px">${esc(t("mRefHint"))}</p>
      <div class="mform">
        <div><label>${esc(t("mRefFile", { el: state.el }))}</label><input type="file" id="mRefFile">${loaded(mt.ref)}
          ${mt.sample?.refY ? `<label style="margin-top:4px"><input type="checkbox" id="mInFile"${mt.useInFileRef ? " checked" : ""}> ${esc(t("mRefInFile"))}</label>` : ""}</div>
        <div><label>${esc(t("mFac"))}</label><select id="mFac">${opt("", t("mFacNone"), mt.fac)}${Object.keys(d.src || {}).map(k => opt(k, `${facKeyLabel(k)} (${d.src[k] >= 0 ? "+" : ""}${d.src[k]} eV)`, mt.fac)).join("")}</select></div>
        <div><label>${esc(t("mFine"))}</label><input type="range" id="mFineR" min="-10" max="10" step="0.1" value="${mt.fine}" style="width:100%">
          <input type="number" id="mFine" min="-30" max="30" step="0.1" value="${mt.fine}"></div>
        <div><label>${esc(t("mWin"))}</label><select id="mWin">${[["-20,50", "−20〜+50 eV"], ["-15,30", "−15〜+30 eV"], ["-20,20", "−20〜+20 eV"], ["-30,70", "−30〜+70 eV"]].map(([v, l]) => opt(v, l, mt.win)).join("")}</select></div>
      </div>
      <p class="hint" style="margin:0">${esc(d.eh ? t("mRefBase", { el: state.el, edge: mt.edge, eh: d.eh }) : t("mRefNoBase"))}</p>
      <p class="hint" style="margin:0" id="mOffText">${esc(offText(off))}</p></div>`;
    h += `<div class="btns"><button type="button" class="primary" id="mRun"${mt.sample && !mt.sample.bad ? "" : " disabled"}>${esc(t("mRun"))}</button></div>`;
    h += `<div id="mOut">${resultsHtml()}</div>`;
    h += `<details class="mnote"><summary>${esc(t("mHow"))}</summary>${t("mHowBody", { ec: d.ec })}</details>`;
    box.innerHTML = h;
    bindMatch();
  }

  function resultsHtml() {
    const R = mt.results, d = mt.data;
    if (!R) return "";
    if (!R.rows.length) return `<p class="status">${esc(t("mNoCand"))}</p>`;
    const rows = R.rows.slice(0, mt.top), fmt = (k, v) => k === "total" ? v.toFixed(1) : k === "rf" ? v.toFixed(4) : v.toFixed(3);
    const th = (k, label) => `<th class="sort${mt.sortBy === k ? " sorted" : ""}" data-sort="${k}">${esc(t(label))}</th>`;
    let h = `<div class="mstep"><h3>${esc(t("mResult", { n: R.rows.length, top: rows.length }))}</h3>
      <p class="hint" style="margin:0 0 4px">${esc(t("mSortHint"))}</p>
      <div class="list" style="max-height:40vh"><table class="mres"><thead><tr><th>${esc(t("mRank"))}</th><th>${esc(t("mName"))}</th><th>${esc(t("mSrc"))}</th>
      <th title="${esc(t("mCalTip"))}">${esc(t("mCal"))}</th><th title="${esc(t("mOvTip"))}">${esc(t("mOv"))}</th>
      ${th("total", "mTotal")}${M_KEYS.map(([k, l]) => th(k, l)).join("")}</tr></thead><tbody>
      ${rows.map((r, i) => `<tr data-i="${i}" class="${i === mt.sel ? "on" : ""}"><td class="num">${i + 1}</td>
        <td>${esc(lang === "ja" && r.it.ja ? r.it.ja : r.it.n)}${r.it.f ? ` <span class="hint">${esc(r.it.f)}</span>` : ""}</td>
        <td>${esc(srcLabel(r.it))}${r.it.c ? ` ${esc(r.it.c)}` : ""}</td>
        <td title="${esc(t("cal_" + (r.it.cal || "none") + "Tip"))}">${esc(t("cal_" + (r.it.cal || "none")))}${r.it.sh ? ` <span class="hint">${r.it.sh > 0 ? "+" : ""}${r.it.sh}</span>` : ""}</td>
        <td class="num">${Math.round(r.m.ov * 100)}%</td>
        <td class="num">${fmt("total", r.m.total)}</td>${M_KEYS.map(([k]) => `<td class="num">${fmt(k, r.m[k])}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div></div>`;
    // 重ね描き
    const c = rows[mt.sel] || rows[0], nist = refE?.xafs?.[state.el]?.[mt.edge];
    const gx = [];
    for (let g = d.grid[0]; g <= d.grid[1] + 1e-9; g += d.grid[2]) gx.push(d.ec + g);
    const der = a => a.map((v, i) => i && v != null && a[i - 1] != null ? (v - a[i - 1]) / d.grid[2] : null);
    const A = mt.view === "d" ? der(R.u) : R.u, B = mt.view === "d" ? der(c.it.y) : c.it.y;
    const vals = [...A, ...B].filter(v => v != null);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi - lo || 1) * 0.06; lo -= pad; hi += pad;
    const W = 640, L = 74, Rr = 12, T = 22, x0 = gx[0], x1 = gx[gx.length - 1];
    const X = v => L + (v - x0) / (x1 - x0) * (W - L - Rr);
    const nref = nist && nist.v >= x0 && nist.v <= x1 ? [{ v: nist.v, label: `${state.el} ${mt.edge}` }] : [];
    const lab = refLabelRows(nref, X), Bm = 50 + (lab.rows ? 12 + lab.rows * 18 : 0), H = 260 + Bm, Y = v => T + (hi - v) / (hi - lo || 1) * (H - T - Bm);
    const path = a => { let s = "", pen = false; a.forEach((v, i) => { if (v == null) { pen = false; return; } s += `${pen ? "L" : "M"}${X(gx[i]).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; }); return s; };
    const fmtY = v => +v.toPrecision(3);
    h += `<div class="plotbox" style="margin-top:8px"><div class="ctrl"><span class="seg">
      <button type="button" data-mview="mu" class="${mt.view === "mu" ? "on" : ""}">${esc(t("mViewMu"))}</button>
      <button type="button" data-mview="d" class="${mt.view === "d" ? "on" : ""}">${esc(t("mViewD"))}</button></span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img">
      ${niceTicks(x0, x1, 6).map(v => `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H - Bm}"/><text x="${X(v)}" y="${H - Bm + 4}" dy="1em" text-anchor="middle">${v}</text>`).join("")}
      ${niceTicks(lo, hi, 5).map(v => `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 5}" y="${Y(v)}" dy=".35em" text-anchor="end">${fmtY(v)}</text>`).join("")}
      <line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H - Bm}"/><line class="axis" x1="${L}" x2="${W - Rr}" y1="${H - Bm}" y2="${H - Bm}"/>
      ${[R.wlo, R.whi].map(g => `<line class="e0" x1="${X(d.ec + g)}" x2="${X(d.ec + g)}" y1="${T}" y2="${H - Bm}"/>`).join("")}
      ${nref.map(r => `<line class="refline" x1="${X(r.v)}" x2="${X(r.v)}" y1="${T}" y2="${H - Bm}"/>`).join("")}${lab.svg(H - Bm)}
      <path class="curve" d="${path(B)}"/><path class="curve2" d="${path(A)}"/>
      <text x="${L + 6}" y="${T - 6}" style="fill:var(--warn)">━ ${esc(t("mYou"))}</text>
      <text x="${L + 150}" y="${T - 6}" style="fill:var(--accent)">━ ${esc(lang === "ja" && c.it.ja ? c.it.ja : c.it.n)} (${esc(srcLabel(c.it))})</text>
      <text x="${(L + W - Rr) / 2}" y="${H - 4}" text-anchor="middle">${esc(t("energy"))}</text>
      <text transform="translate(4 ${(T + H - Bm) / 2}) rotate(-90)" dy="1em" text-anchor="middle">${esc(t(mt.view === "d" ? "mViewD" : "mViewMu"))}</text>
      </svg><p class="hint">${esc(t("mE0", { e0: R.nz.e0.toFixed(2), step: +R.nz.step.toPrecision(3) }))}</p></div>`;
    return h;
  }

  function bindMatch() {
    const on = (id, ev, f) => { const e = $(id); if (e) e[ev] = f; };
    on("mEdge", "onchange", e => { mt.edge = e.target.value; loadMatchData(); });
    on("mScope", "onchange", e => { mt.scope = e.target.value; if (mt.results) runMatch(); renderMatch(); });
    on("mCrystal", "onchange", e => { mt.crystal = e.target.value; if (mt.results) runMatch(); renderMatch(); });
    on("mTop", "onchange", e => { mt.top = +e.target.value; renderMatch(); });
    on("mSampleFile", "onchange", e => readFile(e.target, p => {
      mt.sample = p; mt.results = null; mt.useInFileRef = !!p.refY && !mt.ref;
      if (p.kind === "table") mt.cfg = guessCols(p.names);
      renderMatch();
    }));
    on("mRefFile", "onchange", e => readFile(e.target, p => { mt.ref = p; mt.useInFileRef = false; if (mt.results) runMatch(); renderMatch(); }));
    on("mInFile", "onchange", e => { mt.useInFileRef = e.target.checked; if (mt.results) runMatch(); renderMatch(); });
    on("mFac", "onchange", e => { mt.fac = e.target.value; if (mt.results) runMatch(); renderMatch(); });
    on("mWin", "onchange", e => { mt.win = e.target.value; if (mt.results) runMatch(); renderMatch(); });
    // 微調整はスライダーを動かしながら結果を更新する（フォームは作り直さず、結果と補正量の表示だけ書き換える）
    const fine = v => { mt.fine = Math.round(+v * 10) / 10 || 0; $("mFine").value = mt.fine; $("mFineR").value = mt.fine;
      if (mt.results) runMatch(); $("mOffText").textContent = offText(currentOffset()); $("mOut").innerHTML = resultsHtml(); bindResults(); };
    on("mFineR", "oninput", e => fine(e.target.value));
    on("mFine", "onchange", e => fine(e.target.value));
    ["mColE", "mColY", "mColA", "mColB"].forEach(id => on(id, "onchange", e => {
      mt.cfg[{ mColE: "e", mColY: "y", mColA: "a", mColB: "b" }[id]] = +e.target.value; mt.results = null; renderMatch(); }));
    on("mMode", "onchange", e => { mt.cfg.mode = e.target.value; mt.results = null; renderMatch(); });
    on("mRun", "onclick", () => { runMatch(); renderMatch(); });
    bindResults();
  }
  function bindResults() {
    const redraw = () => { $("mOut").innerHTML = resultsHtml(); bindResults(); };
    document.querySelectorAll("#mOut [data-sort]").forEach(b => b.onclick = () => { mt.sortBy = b.dataset.sort; sortResults(); mt.sel = 0; mt.selKey = mt.results.rows[0]?.it.k || ""; redraw(); });
    document.querySelectorAll("#mOut tr[data-i]").forEach(tr => tr.onclick = () => { mt.sel = +tr.dataset.i; mt.selKey = mt.results.rows[mt.sel]?.it.k || ""; redraw(); });
    document.querySelectorAll("#mOut [data-mview]").forEach(b => b.onclick = () => { mt.view = b.dataset.mview; redraw(); });
  }
  function offText(off) {
    const sg = v => `${v >= 0 ? "+" : ""}${v.toFixed(2)}`;
    const how = off.how === "ref" ? t("mHowRef", { u: off.u.toFixed(2), d: off.d.toFixed(2) })
      : off.how === "fac" ? t("mHowFac", { fac: facKeyLabel(mt.fac) }) : t("mHowNone");
    return t("mOffTotal", { base: sg(off.base), how, fine: sg(off.fine), total: sg(off.o) });
  }

  // ---- 言語 ----
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t("docTitle");
    document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
    document.querySelectorAll("[data-i18n-ph]").forEach(e => e.placeholder = t(e.dataset.i18nPh));
    document.querySelectorAll("[data-i18n-aria]").forEach(e => e.setAttribute("aria-label", t(e.dataset.i18nAria)));
    $("lang").textContent = t("langBtn");
    $("guide").href = `guide.html?lang=${lang}`;
    if (state.method) {
      fillFacility(); renderFooter(); paintTable(); render(); renderCart(); renderPlot();
      $("status").textContent = t(state.status.key, state.status.vars);
    }
  }
  $("lang").onclick = () => {
    lang = lang === "ja" ? "en" : "ja";
    try { localStorage.setItem("refspec-lang", lang); } catch {}
    applyLang();
  };

  // ---- 切り替え ----
  async function setMethod(m) {
    if (state.method === m) return;
    state.method = m; state.facility = ""; state.el = null; state.recs = []; closePlot();
    document.querySelector("main").classList.toggle("match", m === "MATCH");
    document.querySelector(".modebar").classList.toggle("match", m === "MATCH");
    document.querySelectorAll("#method button").forEach(x => x.classList.toggle("on", x.dataset.v === m));
    document.querySelectorAll(".xafs-only").forEach(x => x.classList.toggle("hide",
      state.method === "HAXPES" || (state.method === "IXDB" && !x.querySelector("#edge"))));
    ["edge", "crystal", "mtype"].forEach(id => $(id).value = "");
    fillFacility(); renderFooter(); setStatus("pickElement"); render();
    if (state.method === "MATCH") {
      if (!mt.index) try { const d = await (await fetch("spectra/xanes/index.json")).json(); mt.index = d.edges || d; mt.indexDate = d.generated || ""; } catch { mt.index = {}; }
    }
    if (state.method === "HAXPES" || state.method === "IXDB") {
      setStatus("loading");
      try { await (state.method === "HAXPES" ? loadHaxpes() : loadIxdb()); setStatus("pickElement"); renderFooter(); }
      catch (e) { setStatus("loadFail", { msg: e.message }, true); }
    }
    paintTable();
  }
  document.querySelectorAll("#method button").forEach(b => b.onclick = () => setMethod(b.dataset.v));
  $("facility").onchange = () => {
    state.facility = $("facility").value; paintTable();
    ["edge", "crystal", "mtype"].forEach(k => fillSelect(k, k)); render();
  };
  $("q").oninput = render;
  ["edge", "crystal", "mtype"].forEach(id => $(id).onchange = render);

  $("dlzip").onclick = async () => {
    // ブラウザの複数ダウンロード制限を避けるため、少し間隔をあけて順に開始
    for (const r of [...state.cart.values()].filter(r => r.zip)) {
      const a = document.createElement("a"); a.href = r.zip; a.rel = "noopener";
      document.body.appendChild(a); a.click(); a.remove();
      await new Promise(res => setTimeout(res, 1500));
    }
  };
  $("dlcsv").onclick = () => {
    const rows = [["source", "name", "formula", "edge", "crystal", "facility_or_db", "beamline", "doi", "doi_url", "page_url", "zip_url"]]
      .concat([...state.cart.values()].map(r => {
        const doi = r.realDoi ?? r.doi;
        return [r.method, r.name, r.formula, r.edge, r.crystal, r.method === "IXDB" ? L(IXDB_DBS[r.db] || r.db) + (r.fac ? ` / ${r.fac}` : "") : r.publisher, r.beamline, doi, doi ? `https://doi.org/${doi}` : "", r.page, r.zip];
      }));
    const csv = "﻿" + rows.map(row => row.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "standard_spectra_selected.csv"; a.click(); URL.revokeObjectURL(a.href);
  };
  $("cite").onclick = async () => {
    // 引用文は論文で使うため常に英語
    const items = [...state.cart.values()];
    const lines = items.map(r => {
      if (r.method === "IXDB") return `${r.title} (${r.edge}), ${IXDB_DBS[r.db]?.en || r.db}, ${r.realDoi ? "https://doi.org/" + r.realDoi : r.page}`;
      const fac = FACILITIES[r.facilityKey]?.short.en || r.publisher;
      const desc = r.method === "HAXPES" ? `HAXPES, ${fac} ${r.beamline}` : `${r.edge}, ${r.crystal ? r.crystal + ", " : ""}${fac}`;
      return `${r.method} spectrum of ${r.name} (${desc}), ${METHODS[r.method].dbName}, https://doi.org/${r.doi}`;
    });
    if (items.some(r => r.method === "IXDB")) lines.push("M. Ishii et al., J. Synchrotron Rad. 32 (2025), https://doi.org/10.1107/S1600577525002206 (International XAFS DB Portal).");
    if (items.some(r => r.method === "XAFS" && r.facilityKey === "SPring-8")) lines.push("Ofuchi, Matsumoto, Honma, Radiat. Phys. Chem. 218 (2024) 111581.");
    try { await navigator.clipboard.writeText(lines.join("\n")); $("cite").textContent = t("copied"); }
    catch { prompt(t("citePrompt"), lines.join(" / ")); }
    setTimeout(() => $("cite").textContent = t("cite"), 1500);
  };
  $("clearSel").onclick = () => { state.cart.clear(); render(); renderCart(); };

  // 作成日を出すために、XANES 類似検索の索引の一覧と文献値は最初に読んでおく（どちらも小さい）
  Promise.all([
    fetch("spectra/xanes/index.json").then(r => r.ok ? r.json() : {}).then(d => { mt.index = d.edges || d; mt.indexDate = d.generated || ""; }).catch(() => { mt.index = {}; }),
    loadRefEnergies(),
  ]).then(() => { renderFooter(); if (state.method === "MATCH") paintTable(); });
  applyLang();
  renderCart();
  setMethod("IXDB");
})();
</script>
</body>
</html>
