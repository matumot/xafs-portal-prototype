<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>標準試料スペクトル検索（試作）</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2430; --muted: #5d6878; --line: #dde2e8;
    --accent: #1f5c99; --accent-soft: #e6eef7; --avail: #d9ebf9; --avail-ink: #12406b;
    --sel: #1f5c99; --sel-ink: #ffffff; --warn: #8a5a00; --err: #b3261e; --ref: #2e7d32;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --panel: #1a2029; --ink: #e5e9ef; --muted: #9aa5b4; --line: #2c3542;
      --accent: #7fb4e8; --accent-soft: #223246; --avail: #23384f; --avail-ink: #cfe3f7;
      --sel: #7fb4e8; --sel-ink: #0d1520; --warn: #e0b45a; --err: #f2948c; --ref: #81c784;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; font-size: 14px; }
  header { padding: 16px 20px 8px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--accent-soft);
    color: var(--accent); font-size: 11.5px; margin-left: 8px; vertical-align: middle; }
  .modebar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 4px 20px 8px; }
  .seg { display: inline-flex; }
  .seg button { font: inherit; font-size: 13px; padding: 6px 14px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); cursor: pointer; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: var(--accent); color: var(--sel-ink); border-color: var(--accent); }
  .modebar label { font-size: 12.5px; color: var(--muted); }
  .modebar select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px;
    background: var(--panel); color: var(--ink); }
  main { display: grid; grid-template-columns: minmax(340px, 460px) 1fr; gap: 14px; padding: 4px 20px 20px; align-items: start; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; padding: 4px 12px 16px; } .modebar { padding: 4px 12px 8px; } }
  main > * { min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .panel h2 { font-size: 14px; margin: 0 0 8px; color: var(--accent); }
  .ptable { display: grid; grid-template-columns: repeat(18, 1fr); gap: 2px; }
  .el { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 3px; font-size: 10.5px; padding: 0;
    display: flex; align-items: center; justify-content: center; color: var(--muted); background: transparent;
    cursor: pointer; font-family: inherit; }
  .el.avail { background: var(--avail); color: var(--avail-ink); font-weight: 600; }
  .el:hover { outline: 2px solid var(--accent); }
  .el.sel { background: var(--sel); color: var(--sel-ink); }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .filters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .filters label { font-size: 12px; color: var(--muted); display: block; }
  .filters input, .filters select { width: 100%; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 5px; background: var(--panel); color: var(--ink); font: inherit; }
  .filters .wide { grid-column: 1 / -1; }
  .filters .hide { display: none; }
  .status { color: var(--muted); font-size: 12.5px; margin: 4px 0 6px; }
  .status.err { color: var(--err); }
  .list { max-height: 60vh; overflow: auto; border-top: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); font-size: 12.5px; vertical-align: top; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; z-index: 1; }
  td.nw { white-space: nowrap; }
  tr.on td { background: var(--avail); }
  td.links a { margin-right: 8px; white-space: nowrap; }
  details.cod { display: inline; }
  details.cod summary { display: inline; cursor: pointer; color: var(--accent); text-decoration: underline; margin-right: 8px; white-space: nowrap; }
  details.cod[open] { display: block; margin: 2px 0; }
  details.cod[open] a { margin-right: 6px; font-size: 11.5px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .btns button { font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  .btns button.primary { background: var(--accent); color: var(--sel-ink); border-color: var(--accent); }
  .btns button:disabled { opacity: .5; cursor: default; }
  .cart li { margin-bottom: 4px; font-size: 12.5px; }
  .cart ul { padding-left: 18px; margin: 6px 0; }
  a { color: var(--accent); }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  footer { padding: 0 20px 24px; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .note { color: var(--warn); }
  .related { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12.5px; }
  .related h3 { font-size: 13px; margin: 0 0 4px; color: var(--accent); }
  .related ul { margin: 4px 0; padding-left: 18px; }
  .related li { margin-bottom: 3px; }
  .related .muted { color: var(--muted); }
  .linkbtn { font: inherit; padding: 0; border: none; background: none; color: var(--accent); text-decoration: underline; cursor: pointer; }
  .topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .lang { font: inherit; font-size: 12.5px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; }
  .lang:hover { border-color: var(--accent); }
  .topbtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  a.lang { text-decoration: none; color: var(--ink); }
  /* プロットは、広い画面では左列の周期表の下、狭い画面では一覧の上に出す（どちらも一覧と同時に見えるように） */
  .plotbox { margin: 0 0 8px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; }
  #plotSlotWide .plotbox { margin: 10px 0 0; }
  #plotSlotWide .plotbox svg text { font-size: 15px; }
  #plotSlotNarrow:has(.plotbox:not([hidden])) ~ .list { max-height: 36vh; }
  /* 拡大表示：画面いっぱいに重ねて出す（Esc か「縮小」で戻る） */
  .plotbox.big { position: fixed; inset: 3vh 3vw auto; max-height: 94vh; z-index: 20; margin: 0; overflow: auto; background: var(--panel);
    box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .45); }
  .plotbox.big svg { max-height: calc(94vh - 170px); }
  #plotSlotWide .plotbox.big svg text, .plotbox.big svg text { font-size: 9px; }
  /* スマホの縦画面では幅が変わらず拡大の意味がないので出さない */
  @media (max-width: 600px) { .plotbox.big svg text { font-size: 18px; } #plotBig { display: none; } }
  .plotbox .pbtns { display: flex; gap: 12px; white-space: nowrap; }
  /* XANES 類似検索 */
  main.match .std { display: none; }
  main:not(.match) #matchPanel { display: none; }
  .modebar.match #facilityLabel, .modebar.match #facility { display: none; }
  .mform { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 6px 0 10px; }
  .mform label { font-size: 12px; color: var(--muted); display: block; }
  .mform select, .mform input[type=number] { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px;
    background: var(--panel); color: var(--ink); font: inherit; font-size: 12.5px; }
  .mstep { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  .mstep h3 { font-size: 13px; margin: 0 0 4px; color: var(--accent); }
  .mstep input[type=file] { font: inherit; font-size: 12.5px; max-width: 100%; }
  .mcols { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; margin-top: 6px; }
  .mcols select { font: inherit; font-size: 12.5px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 5px;
    background: var(--panel); color: var(--ink); }
  table.mres td, table.mres th { font-size: 12px; padding: 4px 5px; }
  table.mres td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.mres tbody tr { cursor: pointer; }
  table.mres tbody tr.on td { background: var(--accent-soft); }
  table.mres th.sort { cursor: pointer; text-decoration: underline dotted; }
  table.mres th.sorted { color: var(--accent); }
  .plotbox .curve2 { fill: none; stroke: var(--warn); stroke-width: 1.8; }
  .plotbox .refline { stroke: var(--ref); stroke-width: 1.2; stroke-dasharray: 6 3; }
  .plotbox svg text.reflabel { fill: var(--ref); font-size: 10px; }
  #plotSlotWide .plotbox svg text.reflabel { font-size: 13px; }
  #plotSlotWide .plotbox.big svg text.reflabel, .plotbox.big svg text.reflabel { font-size: 9px; }
  @media (max-width: 600px) { .plotbox svg text.reflabel { font-size: 15px; } }
  .mnote { font-size: 12px; color: var(--muted); }
  .mnote li { margin-bottom: 3px; }
  tr.plotting td { background: var(--accent-soft); }
  tr.plotting td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .plotbox[hidden] { display: none; }
  .plotbox .phead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .plotbox h3 { font-size: 13px; margin: 0; }
  .plotbox .ctrl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 6px 0; font-size: 12.5px; }
  .plotbox .ctrl select { font: inherit; font-size: 12.5px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px;
    background: var(--panel); color: var(--ink); max-width: 100%; }
  .plotbox .seg button { font-size: 12px; padding: 3px 10px; }
  .plotbox .seg button:disabled { opacity: .5; cursor: default; }
  .plotbox svg { width: 100%; height: auto; display: block; }
  .plotbox svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  @media (max-width: 600px) { .plotbox svg text { font-size: 18px; } }
  .plotbox .axis { stroke: var(--muted); stroke-width: 1; }
  .plotbox .grid { stroke: var(--line); stroke-width: 1; }
  .plotbox .curve { fill: none; stroke: var(--accent); stroke-width: 1.6; }
  .plotbox .fit { fill: none; stroke: var(--warn); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .plotbox .e0 { stroke: var(--err); stroke-width: 1; stroke-dasharray: 2 3; }
  td.links .linkbtn, td.links .pending { white-space: nowrap; }
  .pending { color: var(--muted); font-size: 12px; cursor: help; }
</style>
</head>
<body>
<header>
  <div class="topline">
    <h1><span data-i18n="title"></span><span class="badge" data-i18n="badge"></span></h1>
    <span class="topbtns"><a class="lang" id="guide" href="guide.html" target="_blank" rel="noopener" data-i18n="guide"></a>
    <button type="button" class="lang" id="lang" aria-label="Language"></button></span>
  </div>
  <p data-i18n="lead"></p>
</header>

<div class="modebar">
  <span class="seg" id="method" role="group" data-i18n-aria="methodAria">
    <button type="button" data-v="IXDB" class="on" data-i18n="tabIXDB"></button>
    <button type="button" data-v="XAFS" data-i18n="tabXAFS"></button>
    <button type="button" data-v="HAXPES" data-i18n="tabHAXPES"></button>
    <button type="button" data-v="MATCH" data-i18n="tabMatch"></button>
  </span>
  <label for="facility" id="facilityLabel"></label>
  <select id="facility"></select>
</div>

<main>
  <section class="panel">
    <h2 data-i18n="step1"></h2>
    <div class="ptable" id="ptable" data-i18n-aria="ptAria"></div>
    <p class="hint" id="ptHint"></p>
    <div id="plotSlotWide"></div>
    <div class="related" id="related"></div>
  </section>

  <section class="panel">
    <h2 class="std" data-i18n="step2"></h2>
    <div class="filters std">
      <div class="wide"><label for="q" data-i18n="qLabel"></label>
        <input id="q" type="search" data-i18n-ph="qPh"></div>
      <div class="xafs-only"><label for="edge" data-i18n="edge"></label><select id="edge"><option value="" data-i18n="all"></option></select></div>
      <div class="xafs-only"><label for="crystal" data-i18n="crystal"></label><select id="crystal"><option value="" data-i18n="all"></option></select></div>
      <div class="xafs-only"><label for="mtype" data-i18n="mtype"></label><select id="mtype"><option value="" data-i18n="all"></option></select></div>
    </div>
    <div class="status std" id="status"></div>
    <div id="plotSlotNarrow" class="std"><div class="plotbox" id="plot" hidden></div></div>
    <div class="list std">
      <table>
        <thead id="thead"></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <h2 class="std" style="margin-top:14px" data-i18n="step3"></h2>
    <div class="cart std" id="cart"></div>
    <div class="btns std">
      <button type="button" class="primary" id="dlzip" disabled data-i18n="dlzip"></button>
      <button type="button" id="dlcsv" disabled data-i18n="dlcsv"></button>
      <button type="button" id="cite" disabled data-i18n="cite"></button>
      <button type="button" id="clearSel" disabled data-i18n="clearSel"></button>
    </div>
    <p class="hint std" data-i18n="dlHint"></p>
    <div id="matchPanel"></div>
  </section>
</main>

<footer id="footer"></footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const API = "https://api.datacite.org/dois";
  const FIELDS = "doi,titles,subjects,url,publisher,publicationYear";

  // ---- 表示文言（日本語／英語）----
  const I18N = {
    ja: {
      guide: "利用者ガイド", title: "標準試料スペクトル検索", badge: "試作版", docTitle: "標準試料スペクトル検索（試作）", langBtn: "English",
      lead: "NIMS MDR に登録された XAFS／HAXPES 標準試料を DOI 登録情報（DataCite）から、または各国の XAFS データベースを International XAFS DB Portal（IXDB）の知識グラフから検索します。データ本体は選んだ試料だけ各データベースから直接取得します。",
      tabMatch: "XANES 類似検索", ptHintMatch: "色付き：比較できる XANES がある元素（取り込み済みのスペクトルから作成）",
      mTitle: "② 測定データと似ている標準試料を探す（XANES）", mEdge: "吸収端", mCrystal: "分光結晶（MDR のみ）", mScope: "比較する対象",
      mScopeAll: "すべてのデータベース", mTop: "表示する候補数", mAny: "指定しない",
      mPick: "左の周期表から元素を選んでください。",
      mSample: "測定データ（試料）", mSampleHint: "テキスト形式（2 列 E・μ、Athena・XDI、PF9809 形式 .dat など）。エネルギーは eV（keV なら自動で換算）。",
      mRef: "エネルギー補正（リファレンス）", mRefHint: "同じ測定条件で測ったリファレンス（金属箔など）があれば読み込んでください。半値エネルギーを DB の基準値に合わせて補正します。リファレンスがないときは測定した施設を選ぶとその代表的な補正量を使います。どちらの場合も微調整で重なり具合を見ながら合わせられます。",
      mRefFile: "測定したリファレンス（{el} の金属箔など）", mRefInFile: "測定データのファイル内のリファレンス（I1/I2）を使う",
      mRefBase: "基準：DB の {el} 金属（箔）の半値エネルギー {eh} eV（DB 側も施設ごとにこの値にそろえてあります）",
      mRefNoBase: "この吸収端は DB に金属のスペクトルがないため、リファレンスでの補正はできません。補正量を手で入れてください。",
      mFac: "測定した施設（リファレンスがないときの補正量の初期値）", mFacNone: "指定しない（補正 0）",
      mFine: "微調整 (eV)：動かすと結果がすぐ更新されます", mWin: "比較する範囲（Ec 基準）",
      mOffTotal: "補正量 {total} eV ＝ 基準 {base} eV（{how}）＋ 微調整 {fine} eV",
      mHowRef: "測定したリファレンスの半値エネルギー {u} eV → 基準 {d} eV", mHowFac: "{fac} の代表値", mHowNone: "リファレンス・施設の指定なし。施設間で数 eV ずれることがあります",
      mCal: "DB 側の補正", mCalTip: "DB のスペクトルのエネルギーをどう補正したか（数値はずらした量 eV）",
      cal_ref: "個別", cal_refTip: "このデータと同時に測ったリファレンスで 1 件ずつ補正（同じ施設でも測定ごとの E0 の動きを補正）",
      cal_fac: "施設", cal_facTip: "施設・分光結晶ごとの代表値（金属の半値エネルギーの中央値）で補正",
      cal_none: "なし", cal_noneTip: "同時測定のリファレンスも、施設の金属のスペクトルもないため補正なし",
      mOv: "重なり", mOvTip: "比較する範囲のうち、両方にデータのある割合（測定範囲や点の間隔の違いの目安。60% 未満は比較しません）",
      mCols: "列：", mColE: "エネルギー", mColY: "強度", mYcol: "その列", mYln: "ln(A/B)", mYratio: "A/B",
      mLoaded: "{name}：{n} 点（{lo}〜{hi} eV）", mParseFail: "{name} を読み取れませんでした（数値の列が見つかりません）",
      mRun: "比較する", mNoEdge: "測定データの {ec} eV 付近に吸収端が見つかりません（エネルギーの範囲・単位と吸収端を確認してください）",
      mResult: "③ 結果：似ている順（{n} 件中、上位 {top} 件）", mNoCand: "比べられる DB のスペクトルがありません",
      mRank: "順位", mName: "試料", mSrc: "データ", mTotal: "総合", mPearson: "Pearson", mDeriv: "微分 Pearson", mCos: "コサイン",
      mSpear: "Spearman", mRf: "R 因子", mRuz: "Ruzicka", mSortHint: "見出しをクリックするとその指標で並べ替えます。行をクリックすると下に重ねて表示します。",
      mViewMu: "規格化 μ(E)", mViewD: "一次微分", mYou: "測定データ", mE0: "E0 = {e0} eV（補正後）、edge step = {step}",
      mHow: "比較の方法と類似度の指標",
      mHowBody: `<ul>
        <li>測定データと DB のスペクトルを同じ手順で規格化します：吸収端の文献値 Ec（{ec} eV）付近で E0（一次微分の最大）を求め、前縁を直線、吸収端より上を直線または 2 次式で近似して edge step = 1 にそろえ、吸収端より上の傾きを差し引いて平らにします（Athena の flatten と同じ考え方）。</li>
        <li>Ec−30〜Ec+70 eV を 0.5 eV 間隔にそろえ、両方にデータのある範囲で比べます。施設やビームラインで校正の基準が違うため（例：Cu K 端の校正値 8980.23 eV（SPring-8）、8980.52 eV（あいち SR）、8981.3 eV（SAGA-LS））、DB 側は施設・分光結晶ごとに、その元素の金属（箔）の半値エネルギー（規格化 μ = 0.5）の中央値を共通の基準値にそろえてあります。測定データは、読み込んだリファレンスの半値エネルギーをその基準値に合わせて補正します（金属は前縁の肩のため一次微分の最大の位置が安定しないので、半値エネルギーを使います）。同じ施設でも測定ごとに E0 が動くことがあるため、DB のデータに同時測定のリファレンスがあるもの（表の「DB 側の補正」が「個別」）は、そのリファレンスで 1 件ずつ合わせています。</li>
        <li>測定の点の間隔やエネルギー範囲の違いは、共通の格子への線形補間と「比較する範囲」でそろえます。範囲の 60% 以上で両方にデータがあるものだけを比べ、その割合を「重なり」に示します。</li>
        <li><b>Pearson 相関係数・コサイン類似度・Ruzicka 類似度</b>：XANES の照合アルゴリズム ELSIE で使われている指標（C. Zheng et al., <i>npj Comput. Mater.</i> <b>4</b>, 12 (2018), <a href="https://doi.org/10.1038/s41524-018-0067-x" target="_blank" rel="noopener">doi:10.1038/s41524-018-0067-x</a>）。Ruzicka は負の値を 0 として計算。</li>
        <li><b>微分 Pearson</b>：一次微分スペクトルの Pearson 相関。ピーク位置や肩の形に敏感です（施設間のスペクトルの比較に一次微分を使った例：M. Ishii et al., <i>STAM Methods</i> <b>3</b>, 2197518 (2023), <a href="https://doi.org/10.1080/27660400.2023.2197518" target="_blank" rel="noopener">doi:10.1080/27660400.2023.2197518</a>）。</li>
        <li><b>Spearman 順位相関</b>：強度の大小関係だけを見るので、強度の目盛りの違いに強い指標（Ti K 端 XANES の計算コード比較で使用：<a href="https://arxiv.org/abs/2303.17089" target="_blank" rel="noopener">arXiv:2303.17089</a>）。</li>
        <li><b>R 因子</b>：Σ(測定−DB)² / Σ測定²。小さいほど似ています（Athena の線形結合フィットの R-factor と同じ形：B. Ravel & M. Newville, <i>J. Synchrotron Rad.</i> <b>12</b>, 537 (2005)）。</li>
        <li><b>総合</b>：上の 6 指標それぞれの順位の平均。ELSIE が複数の指標を組み合わせて精度を上げているのにならった簡易版です。</li>
        <li>試作版です。似ている順は参考で、物質の同定を保証するものではありません。比べる DB のスペクトルは取り込み済みのもの（下の取り込み状況）だけです。</li>
      </ul>`,

    en: {
      guide: "User guide", title: "Reference Spectra Search", badge: "Prototype", docTitle: "Reference Spectra Search (prototype)", langBtn: "日本語",
      lead: "Search XAFS/HAXPES reference samples registered in NIMS MDR via their DOI metadata (DataCite), or XAFS databases worldwide via the knowledge graph of the International XAFS DB Portal (IXDB). Data files are retrieved directly from each database, only for the samples you select.",

      mScopeAll: "All databases", mTop: "Candidates to show", mAny: "Any",
      mPick: "Select an element in the periodic table.",
      mSample: "Your data (sample)", mSampleHint: "Text files (2 columns E, μ; Athena; XDI; PF9809 .dat, etc.). Energy in eV (keV is converted).",
      mRef: "Energy correction (reference)", mRefHint: "If you have a reference (e.g. metal foil) measured under the same conditions, load it; its half-step energy is aligned with the database reference point. Without one, choose the facility of your data to use its typical shift. In both cases you can fine-tune the shift while watching the overlay.",
      mRefFile: "Your reference (e.g. {el} metal foil)", mRefInFile: "Use the reference in the data file (I1/I2)",
      mRefBase: "Reference point: half-step energy of {el} metal (foil) in the database, {eh} eV (database spectra are aligned to it per facility)",
      mRefNoBase: "No metal spectrum for this edge in the database, so a reference cannot be used. Enter the shift by hand.",
      mFac: "Facility of your data (default shift without a reference)", mFacNone: "Not specified (shift 0)",
      mFine: "Fine adjustment (eV): results update as you move it", mWin: "Range compared (relative to Ec)",
      mOffTotal: "Shift {total} eV = base {base} eV ({how}) + fine {fine} eV",
      mHowRef: "your reference's half-step energy {u} eV → reference point {d} eV", mHowFac: "typical value for {fac}", mHowNone: "no reference or facility; facilities can differ by a few eV",
      mCal: "DB alignment", mCalTip: "How the database spectrum's energy was aligned (number: shift in eV)",
      cal_ref: "own ref.", cal_refTip: "Aligned individually with the reference measured with this spectrum (corrects E0 drift between measurements at the same facility)",
      cal_fac: "facility", cal_facTip: "Aligned with the facility/crystal typical value (median half-step energy of the metal)",
      cal_none: "none", cal_noneTip: "No reference with the spectrum and no metal spectrum from the facility, so not aligned",
      mOv: "Overlap", mOvTip: "Share of the compared range where both have data (indicates differences in measured range or step; below 60% is not compared)",
      mCols: "Columns:", mColE: "Energy", mColY: "Signal", mYcol: "column", mYln: "ln(A/B)", mYratio: "A/B",
      mLoaded: "{name}: {n} points ({lo}–{hi} eV)", mParseFail: "Could not read {name} (no numeric columns found)",
      mRun: "Compare", mNoEdge: "No absorption edge found near {ec} eV in your data (check the energy range/unit and the edge)",
      mResult: "3. Results: most similar first (top {top} of {n})", mNoCand: "No database spectra to compare",
      mRank: "#", mName: "Sample", mSrc: "Data", mTotal: "Overall", mPearson: "Pearson", mDeriv: "Deriv. Pearson", mCos: "Cosine",
      mSpear: "Spearman", mRf: "R-factor", mRuz: "Ruzicka", mSortHint: "Click a header to sort by that metric; click a row to overlay it below.",
      mViewMu: "Normalized μ(E)", mViewD: "First derivative", mYou: "Your data", mE0: "E0 = {e0} eV (after shift), edge step = {step}",
      mHow: "How spectra are compared, and the similarity metrics",
      mHowBody: `<ul>
        <li>Your data and the database spectra are normalized the same way: E0 (maximum of the first derivative) is found near the tabulated edge energy Ec ({ec} eV); a line below the edge and a line or quadratic above it are fitted, the edge step is scaled to 1, and the post-edge slope is removed (flattened, as in Athena).</li>
        <li>Spectra are put on a 0.5 eV grid from Ec−30 to Ec+70 eV and compared where both have data. Calibration conventions differ between facilities (e.g. Cu K-edge set to 8980.23 eV at SPring-8, 8980.52 eV at Aichi SR, 8981.3 eV at SAGA-LS), so database spectra are aligned per facility and mono crystal: the median half-step energy (normalized μ = 0.5) of that element's metal (foil) is moved to a common reference point. Your data are shifted so that your reference's half-step energy matches that point (the half-step energy is used because the pre-edge shoulder of metals makes the derivative maximum unstable). Because E0 can drift between measurements even at the same facility, database spectra with a reference measured at the same time ("own ref." in the DB alignment column) are aligned individually with that reference.</li>
        <li>Differences in energy step and range are handled by linear interpolation onto the common grid and by the compared range; only spectra with data in at least 60% of the range are compared, and that share is shown as "Overlap".</li>
        <li><b>Pearson correlation, cosine similarity, Ruzicka similarity</b>: metrics used in the ELSIE XANES matching algorithm (C. Zheng et al., <i>npj Comput. Mater.</i> <b>4</b>, 12 (2018), <a href="https://doi.org/10.1038/s41524-018-0067-x" target="_blank" rel="noopener">doi:10.1038/s41524-018-0067-x</a>). Negative values are set to 0 for Ruzicka.</li>
        <li><b>Derivative Pearson</b>: Pearson correlation of the first derivatives; sensitive to peak and shoulder positions (first derivatives were used to compare spectra across facilities in M. Ishii et al., <i>STAM Methods</i> <b>3</b>, 2197518 (2023), <a href="https://doi.org/10.1080/27660400.2023.2197518" target="_blank" rel="noopener">doi:10.1080/27660400.2023.2197518</a>).</li>
        <li><b>Spearman rank correlation</b>: uses only the ordering of intensities, so it is robust to intensity scale (used in a multi-code benchmark of Ti K-edge XANES, <a href="https://arxiv.org/abs/2303.17089" target="_blank" rel="noopener">arXiv:2303.17089</a>).</li>
        <li><b>R-factor</b>: Σ(yours−DB)² / Σyours²; smaller is more similar (same form as the R-factor of linear combination fitting in Athena: B. Ravel &amp; M. Newville, <i>J. Synchrotron Rad.</i> <b>12</b>, 537 (2005)).</li>
        <li><b>Overall</b>: the mean of the ranks in the six metrics above, a simple version of how ELSIE combines several metrics.</li>
        <li>Prototype: the ranking is a guide and does not identify the material. Only imported spectra are compared (see the import status below).</li>
      </ul>`,

        Search: <a href="https://support.datacite.org/docs/api" target="_blank" rel="noopener">DataCite REST API</a>. {extra}<br>
        <span class="note">Prototype. Information shown is based on the metadata registered with each DOI.</span>`,
      citeXafs: "When using SPring-8 BL14B2 data in publications, cite the DOI of each dataset and Ofuchi, Matsumoto, Honma, <i>Radiat. Phys. Chem.</i> <b>218</b> (2024) 111581. For other facilities, follow their citation rules.",
      citeHaxpes: "When using the data in publications, cite the DOI of each dataset and the HAXPES reference sample database (S. Yasuno et al.).",
      relTitle: "Related resources", relSim: "XAFS simulation spectra", relHaxpes: "HAXPES spectra", relCryst: "Crystallographic information",
      relPhase: "Phase diagrams", relProp: "Material and property information", relLogin: " (login required)",
      relHaxpesBtn: "Show HAXPES data for {el} ({n})", relCodEl: "Structures containing {el}",
      plot: "Plot", plotTip: "Plot the spectrum of this dataset on this page", close: "Close", enlarge: "Enlarge", shrink: "Shrink", plotLoading: "Loading spectrum…",
      plotFail: "Could not load the spectrum ({msg})", plotNone: "This dataset has no spectrum that can be plotted.",
      viewRaw: "Raw", viewNorm: "Background-subtracted, normalized", rangeAll: "Full range", rangeXanes: "XANES region", series: "File",
      energy: "Energy (eV)", normAxis: "Normalized μ(E)",
      kmu: "μt", kfl: "Fluorescence If/I0", key: "I/I0", knorm: "Normalized by facility", kref: "Reference μt",
      srcmu: "μt = ln(I0/I)", srcfl: "If/I0", srcey: "Detected intensity / I0", srcnorm: "Background-subtracted and normalized by the facility", srcref: "μt of the reference foil",
      kxps: "Intensity (a.u.)", srcxps: "Photoelectron intensity (processed by the facility)", bindingEnergy: "Binding energy (eV)", region: "Region",
      plotSrcHx: "Processed data (*_sp.csv) from each dataset of MDR HAXPES DB (SPring-8 BL46XU), thinned out for display.",
      refEdge: "Green dashed line: reference {label} edge energy {v} eV (NIST X-ray Transition Energies, SRD 128, {src})", refDiff: "; E0 of this data differs by {d} eV",
      refSrc_direct: "direct measurement", refSrc_combined: "combined value", refSrc_theory: "theory",
      refXps: "Green dashed lines: reference binding energies (NIST XPS Database, SRD 20 recommended values)",
      refXpsMixed: "Green dashed lines: reference binding energies (NIST XPS Database, SRD 20 recommended values; levels without one from Elam et al. via xraydb)",
      normInfo: "E0 = {e0} eV (maximum of the first derivative), edge step = {step}",
      normNote: "Simple processing: a line below the edge and a {post} above it are subtracted and the edge step is scaled to 1. Use Athena or similar for analysis.",
      postLin: "line", postQuad: "quadratic", stepBad: "Cannot normalize because the edge step could not be determined.",
      plotSrc: "Data taken from each dataset of MDR XAFS DB ({src}), thinned out for display.",
      plotSrcDb: "Data taken from {db}, thinned out for display.", plotSrcLive: "Data fetched directly from the {db} API.",
      plotPending: "Plot (in preparation)", impItem: "{db} {n}/{total} ({date})",
      impStatus: "Spectra imported for plotting (imported/total, last import): {items}",
      dataDates: "Data dates: {items}", dIxdb: "IXDB index {d}", dXanes: "XANES matching index {d}", dRef: "reference values (NIST SRD 128, SRD 20) retrieved {d}", plotLic: " License: {lic}", plotMissing: "The spectrum of this record has not been imported yet (prototype: only part of the data is imported so far).",
      relNote: "Same supplementary resources as the International XAFS DB Portal. External links open each site's top or search page.",
    },
  };
  const LANGS = Object.keys(I18N);
  let lang = (() => {
    const q = new URLSearchParams(location.search).get("lang");
    if (LANGS.includes(q)) return q;
    try { const s = localStorage.getItem("refspec-lang"); if (LANGS.includes(s)) return s; } catch {}
    return "ja";
  })();
  const t = (k, v = {}) => (I18N[lang][k] ?? I18N.ja[k] ?? k).replace(/\{(\w+)\}/g, (_, n) => v[n] ?? "");
  const L = o => (typeof o === "string" ? o : o[lang] ?? o.ja);

  // 施設（DataCite の publisher）→ 表示名と、2026-10-22 時点で DataCite に登録のある元素（周期表の色付け用）
  const FACILITIES = {
    "SPring-8": { short: { ja: "SPring-8", en: "SPring-8" }, long: { ja: "SPring-8（BL14B2, JASRI）", en: "SPring-8 (BL14B2, JASRI)" },
      els: "Ag Au Ba Ce Co Cr Cs Cu Er Eu Fe In Ir La Mn Mo Nb Nd Ni Pb Pd Pt Rh Ru Sb Sn Ta Tb Ti V W Yb Zn Zr" },
    "KEK": { short: { ja: "KEK フォトンファクトリー", en: "KEK Photon Factory" },
      els: "Au Ba Ce Co Cr Cs Cu Fe I In Ir Mn Mo Nb Ni Pd Pt Re Rh Ru S Se Ti Zn Zr" },
    "Hokkaido University": { short: { ja: "北海道大学 触媒科学研究所", en: "Hokkaido Univ., Inst. for Catalysis" },
      els: "Ag Au Ce Co Cr Cu Fe In Ir Mn Mo Nb Ni Pd Pt Re Rh Ru Sn Ta Ti Zn" },
    "Ritsumeikan University": { short: { ja: "立命館大学 SR センター", en: "Ritsumeikan Univ. SR Center" },
      els: "Al B C Ca Cl Cu F Fe K Li Mg N Na Ni O P S Si Ti" },
    "Aichi Synchrotron Radiation Center": { short: { ja: "あいちシンクロトロン光センター", en: "Aichi Synchrotron Radiation Center" },
      els: "Ag Au Bi Ce Co Cr Cu Eu Fe Ga Ge Ir Mn Mo Nb Ni Pb Pd Pt Rh Ru Ta Ti V W Y Zn Zr" },
    "Kyushu Synchrotron Light Research Center": { short: { ja: "九州シンクロトロン光研究センター", en: "Kyushu Synchrotron Light Research Center" },
      els: "B C Ca Cl Co K N Ni O P S Ti" },
  };
  const facShort = key => FACILITIES[key] ? L(FACILITIES[key].short) : key;
  const facLong = key => FACILITIES[key] ? L(FACILITIES[key].long || FACILITIES[key].short) : key;
  const CLASSES = new Set(["Oxide", "Pure metal", "Oxide_ate", "Chloride", "Alloy", "Sulfide", "Fluoride", "Sulfate", "Bromide", "Nitrate",
    "Hydroxide", "Boride", "Nitride", "Iodide", "Organometal", "Silicide", "Carbide", "Carbonate", "Oxalate", "Hydride", "Acetate",
    "Acetylacetonate", "Phosphorate", "Chlorate", "Metal acid", "Phosphide", "Phthalocyanine", "Silicate", "Hexafluoride", "Phosphate",
    "Oxynitride", "Oxychloride", "Nonmetal", "Pure metalloid"]);
  const METHODS = {
    XAFS: { collection: "collection - MDR XAFS DB", dbDoi: "10.48505/nims.1447", dbName: "MDR XAFS DB" },
    HAXPES: { collection: "collection - MDR HAXPES DB", dbDoi: "10.48505/nims.3056", dbName: "MDR HAXPES DB" },
  };
  // IXDB が横断する各国データベース（tools/build_ixdb_index.py の db コード）
  const IXDB_DBS = {
    MDR: { ja: "MDR XAFS DB（日本）", en: "MDR XAFS DB (Japan)" },
    CLS: { ja: "CLS XAS Database（カナダ）", en: "CLS XAS Database (Canada)" },
    FAME: { ja: "SSHADE/FAME（フランス）", en: "SSHADE/FAME (France)" },
    XASLIB: { ja: "XASLIB（米国）", en: "XASLIB (USA)" },
    LISA: { ja: "LISA XAS Database（イタリア）", en: "LISA XAS Database (Italy)" },
    IHEP: { ja: "XASDB（中国 IHEP）", en: "XASDB (China, IHEP)" },
    ESRF: { ja: "ESRF ID21 XANES（フランス）", en: "ESRF ID21 XANES (France)" },
  };
  const dbName = code => IXDB_DBS[code] ? L(IXDB_DBS[code]) : code;
  const PT = "H,1,1 He,1,18 Li,2,1 Be,2,2 B,2,13 C,2,14 N,2,15 O,2,16 F,2,17 Ne,2,18 Na,3,1 Mg,3,2 Al,3,13 Si,3,14 P,3,15 S,3,16 Cl,3,17 Ar,3,18 K,4,1 Ca,4,2 Sc,4,3 Ti,4,4 V,4,5 Cr,4,6 Mn,4,7 Fe,4,8 Co,4,9 Ni,4,10 Cu,4,11 Zn,4,12 Ga,4,13 Ge,4,14 As,4,15 Se,4,16 Br,4,17 Kr,4,18 Rb,5,1 Sr,5,2 Y,5,3 Zr,5,4 Nb,5,5 Mo,5,6 Tc,5,7 Ru,5,8 Rh,5,9 Pd,5,10 Ag,5,11 Cd,5,12 In,5,13 Sn,5,14 Sb,5,15 Te,5,16 I,5,17 Xe,5,18 Cs,6,1 Ba,6,2 La,6,3 Hf,6,4 Ta,6,5 W,6,6 Re,6,7 Os,6,8 Ir,6,9 Pt,6,10 Au,6,11 Hg,6,12 Tl,6,13 Pb,6,14 Bi,6,15 Po,6,16 At,6,17 Rn,6,18 Ce,8,4 Pr,8,5 Nd,8,6 Pm,8,7 Sm,8,8 Eu,8,9 Gd,8,10 Tb,8,11 Dy,8,12 Ho,8,13 Er,8,14 Tm,8,15 Yb,8,16 Lu,8,17 Th,9,4 U,9,6"
    .split(" ").map(s => s.split(","));
  const SYMBOLS = new Set(PT.map(p => p[0]));

  const state = { method: "", facility: "", el: null, recs: [], cart: new Map(), haxpes: null, ixdb: null, status: { key: "pickElement" } };
  const cache = new Map();
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // 状態メッセージは「キー＋値」で持ち、言語切替時に再表示できるようにする
  function setStatus(key, vars = {}, err = false) {
    state.status = { key, vars, err };
    $("status").className = "status" + (err ? " err" : "");
    $("status").textContent = t(key, vars);
  }

  // ---- 周期表 ----
  for (const [sym, p, g] of PT) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "el"; b.textContent = sym;
    b.style.gridRow = p; b.style.gridColumn = g; b.dataset.sym = sym;
    b.onclick = () => selectElement(sym);
    $("ptable").appendChild(b);
  }

  function availableElements() {
    if (state.method === "MATCH") return new Set(Object.keys(mt.index || {}).map(k => k.split("_")[0]));
    if (state.method === "HAXPES") return new Set((state.haxpes || []).flatMap(r => r.elements));
    if (state.method === "IXDB") return new Set((state.ixdb || []).filter(matchFacility).map(x => x.el));
    const facs = state.facility ? [state.facility] : Object.keys(FACILITIES);
    return new Set(facs.flatMap(f => FACILITIES[f].els.split(" ")));
  }
  function paintTable() {
    const av = availableElements();
    document.querySelectorAll(".el").forEach(b => {
      b.classList.toggle("avail", av.has(b.dataset.sym));
      b.classList.toggle("sel", b.dataset.sym === state.el);
    });
    $("ptHint").textContent = state.method === "MATCH" ? t("ptHintMatch") : state.method === "HAXPES" ? t("ptHintHx")
      : state.method === "IXDB" ? t("ptHintIx", { date: ixdbGenerated() }) : t("ptHintMdr");
    renderRelated();
  }

  // ---- 関連情報（IXDB トップページの補足情報と同じ外部リソース）----
  // 外部サイトは基本的にトップ／検索ページへのリンク（CPDDB・AtomWork は要ログイン、
  // Materials Project はボット確認あり）。COD は result.php?el1= で元素検索を渡せるので、選択中の元素で検索するリンクも出す。
  // HAXPES はこのページの MDR（HAXPES）タブへ、選択中の元素で切り替えるボタンを出す。
  function renderRelated() {
    const a = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${esc(text)}</a>`;
    const mp = a("https://next-gen.materialsproject.org/", "Materials Project");
    const hxCount = state.el && state.haxpes ? state.haxpes.filter(r => r.elements.includes(state.el)).length : 0;
    const hxBtn = hxCount && state.method !== "HAXPES"
      ? ` — <button type="button" class="linkbtn" id="toHaxpes">${esc(t("relHaxpesBtn", { el: state.el, n: hxCount }))}</button>` : "";
    const codEl = state.el ? ` — ${a(`https://www.crystallography.net/cod/result.php?el1=${state.el}`, t("relCodEl", { el: state.el }))}` : "";
    $("related").innerHTML = `<h3>${esc(t("relTitle"))}</h3><ul>
      <li>${esc(t("relSim"))}: ${mp}</li>
      <li>${esc(t("relHaxpes"))}: ${a("https://doi.org/10.48505/nims.3056", "MDR HAXPES DB")}${hxBtn}</li>
      <li>${esc(t("relCryst"))}: ${a("https://www.crystallography.net/cod/search.html", "Crystallography Open Database (COD)")}${codEl}</li>
      <li>${esc(t("relPhase"))}: ${a("https://cpddb.nims.go.jp/", "Computational Phase Diagram Database (CPDDB)")}<span class="muted">${esc(t("relLogin"))}</span></li>
      <li>${esc(t("relProp"))}: ${mp}, ${a("https://crystdb.nims.go.jp/", "AtomWork")}<span class="muted">${esc(t("relLogin"))}</span></li>
    </ul><p class="hint" style="margin:2px 0 0">${esc(t("relNote"))}${state.method === "IXDB" ? " " + esc(t("relIxdbRow")) : ""}</p>`;
    if (hxBtn) $("toHaxpes").onclick = async () => { const el = state.el; await setMethod("HAXPES"); selectElement(el); };
  }

  // ---- DataCite レコード → 表示用（キーワードの並び順に依存しない）----
  const EDGE = /^([A-Z][a-z]?) (K|L\d*|M\d*)-edge$/;
  function toRecord(item) {
    const a = item.attributes;
    const subj = (a.subjects || []).map(s => s.subject);
    // titles には正式タイトルと別名（"spring8.<id>" など、titleType=AlternativeTitle）があり、順序は不定
    const titles = a.titles || [];
    const title = (titles.find(x => !x.titleType) || titles[0] || {}).title || "";
    const uuid = (a.url || "").split("/").pop();
    // DataCite の url は /pid/{id}（MDR 側で /datasets/{id} へ転送され、それだけで 30 秒程度かかる）なので直接 /datasets/ を使う
    const base = { doi: a.doi, page: uuid ? `https://mdr.nims.go.jp/datasets/${uuid}` : a.url, zip: uuid ? `https://mdr.nims.go.jp/datasets/${uuid}.zip` : "",
      publisher: a.publisher, year: a.publicationYear, keywords: subj.join(" ") };
    if (state.method === "HAXPES" || subj.includes("HAXPES")) {
      const name = title.replace(/^HAXPES spectra of /, "");
      const tok = name.split(/\s+/).find(w => /^([A-Z][a-z]?)+$/.test(w) && splitFormula(w).every(s => SYMBOLS.has(s))) || "";
      return { ...base, method: "HAXPES", name, elements: splitFormula(tok), facilityKey: "SPring-8",
        beamline: subj.find(s => /^BL/.test(s)) || "", edge: "", crystal: "", mtype: "", formula: "" };
    }
    const edge = subj.find(s => EDGE.test(s)) || "";
    const crystal = subj.find(s => /^Si\(\d+\)$/.test(s)) || "";
    const mtype = subj.find(s => CLASSES.has(s)) || "";
    const beamline = subj.find(s => /^(BL[-\w]*|AR-\w+)$/.test(s)) || "";
    const name = title.startsWith("XAFS spectrum of ") ? title.slice(17) : title;
    const skip = new Set([edge, crystal, mtype, beamline, name, "XAFS", "SPring-8", METHODS.XAFS.collection]);
    const cands = subj.filter(s => !skip.has(s) && !/\s/.test(s.replace(/^approx\.\s/, "")) && !CLASSES.has(s) && !/^(Photon|Aichi|SAGA|Ritsumeikan|Hokkaido)/.test(s));
    const formula = cands.find(s => /\d/.test(s)) || cands.find(s => /^[A-Z][a-z]?(-foil)?$/.test(s)) || cands[0] || "";
    return { ...base, method: "XAFS", name, formula: formula.replace(/_/g, "·"), edge, crystal, mtype: mtype.replace(/_/g, " "),
      beamline, facilityKey: a.publisher, element: (edge.match(EDGE) || [])[1] || "" };
  }
  function splitFormula(s) { return (s.match(/[A-Z][a-z]?/g) || []); }

  async function query(q) {
    const params = new URLSearchParams({ query: q, "page[size]": "1000", "fields[dois]": FIELDS });
    const r = await fetch(`${API}?${params}`, { headers: { Accept: "application/vnd.api+json" } });
    if (!r.ok) throw new Error(t("apiErr", { s: r.status }));
    return (await r.json()).data || [];
  }

  async function loadHaxpes() {
    if (state.haxpes) return state.haxpes;
    const items = await query(`subjects.subject:"${METHODS.HAXPES.collection}"`);
    state.haxpes = items.map(toRecord);
    return state.haxpes;
  }

  const ixdbGenerated = () => (window.IXDB_INDEX || {}).generated || "";
  function loadIxdb() {
    if (state.ixdb) return Promise.resolve(state.ixdb);
    return new Promise((ok, ng) => {
      const sc = document.createElement("script");
      sc.src = "ixdb_index.js";
      sc.onload = () => {
        state.ixdb = (window.IXDB_INDEX?.records || []).map(x => {
          const uuid = x.db === "MDR" ? x.url.split("/").pop() : "";
          // doi は選択リストのキー。CLS は URL がトップページだけなので ID を付けて区別する
          return { method: "IXDB", doi: x.doi || (x.wid ? `${x.url}#${x.wid}` : x.url), realDoi: x.doi, wid: x.wid, name: x.group, orig: x.name !== x.group ? x.name : "",
            title: x.title, edge: x.edge, el: x.el, db: x.db, fac: x.fac || "", beamline: x.bl || "",
            facilityKey: x.db === "MDR" ? `MDR|${x.fac || ""}` : x.db, page: x.url,
            zip: uuid ? `https://mdr.nims.go.jp/datasets/${uuid}.zip` : "", formula: "", crystal: "", mtype: "",
            keywords: `${x.group} ${x.name} ${x.title} ${x.edge}`, mat: x.mat };
        }).map(r => {
          // MatVoc Explorer の名称（日本語・英語）・組成式・関連リンク（tools/build_ixdb_index.py で取り込み）
          const m = window.IXDB_INDEX?.materials?.[r.mat] || {};
          return { ...r, mv: m, nameEn: m.en || r.name, nameJa: m.ja || "", formula: m.f || "",
            keywords: `${r.keywords} ${m.en || ""} ${m.ja || ""} ${m.f || ""}` };
        });
        ok(state.ixdb);
      };
      sc.onerror = () => ng(new Error(t("ixdbErr")));
      document.head.appendChild(sc);
    });
  }

  async function fetchXafs(sym) {
    if (cache.has(sym)) return cache.get(sym);
    const edges = ["K", "L1", "L2", "L3", "L21", "L"].map(e => `"${sym} ${e}-edge"`).join(" OR ");
    const items = await query(`subjects.subject:"${METHODS.XAFS.collection}" AND subjects.subject:(${edges})`);
    const recs = items.map(toRecord).filter(r => r.element === sym);
    cache.set(sym, recs);
    return recs;
  }

  async function selectElement(sym) {
    if (state.method === "MATCH") { state.el = sym; paintTable(); return selectMatchElement(sym); }
    if (!state.haxpes) loadHaxpes().then(renderRelated).catch(() => {});
    state.el = sym; paintTable();
    setStatus("searching", { el: sym });
    $("rows").innerHTML = "";
    try {
      const recs = state.method === "HAXPES" ? (await loadHaxpes()).filter(r => r.elements.includes(sym))
        : state.method === "IXDB" ? (await loadIxdb()).filter(r => r.el === sym)
        : await fetchXafs(sym);
      if (state.el !== sym) return;
      state.recs = recs;
      ["edge", "crystal", "mtype"].forEach(k => fillSelect(k, k));
      render();
    } catch (e) {
      setStatus("searchFail", { msg: e.message }, true);
    }
  }

  function fillSelect(id, key) {
    const sel = $(id), cur = sel.value;
    sel.length = 1;
    sel.options[0].textContent = t("all");
    [...new Set(visibleByFacility().map(r => r[key]).filter(Boolean))].sort().forEach(v => sel.add(new Option(v, v)));
    sel.value = [...sel.options].some(o => o.value === cur) ? cur : "";
  }
  // IXDB の施設選択値："MDR" は MDR 全体、"MDR|<施設>" は MDR のうちその施設
  const matchFacility = r => !state.facility || r.facilityKey === state.facility
    || (state.method === "IXDB" && state.facility === "MDR" && r.db === "MDR");
  const visibleByFacility = () => state.recs.filter(matchFacility);
  const facLabel = r => r.method === "IXDB"
    ? (r.db === "MDR" ? `MDR: ${r.fac ? facShort(r.fac) : t("unknownFac")}` : dbName(r.db))
    : facShort(r.facilityKey) || r.publisher;
  const scopeLabel = () => state.facility.startsWith("MDR|")
    ? `MDR XAFS DB: ${facShort(state.facility.slice(4))}` : dbName(state.facility);

  // 表示名：IXDB は MatVoc の名称を表示言語に合わせて使う
  const nm = r => r.method === "IXDB" ? (lang === "ja" && r.nameJa) || r.nameEn || r.name : r.name;
  function relatedHtml(r) {
    if (!r.mat) return "";
    const m = r.mv || {}, a = (href, text, title = "") => `<a href="${esc(href)}" target="_blank" rel="noopener"${title ? ` title="${esc(title)}"` : ""}>${esc(text)}</a>`;
    const mvUrl = `https://matvoc.nims.go.jp/explore/${lang === "ja" ? "ja" : "en"}/results/${r.mat}`;
    return [a(mvUrl, "MatVoc"), m.mp ? a(m.mp, "MP-XAS", "Materials Project XAS") : "",
      codHtml(m.cod || [], a), m.aw ? a(m.aw, "AtomWork") : ""].filter(Boolean).join(" ");
  }
  // COD は個別エントリへ直接リンク。複数あるときはクリックでその場に ID 一覧を開く
  function codHtml(ids, a) {
    const url = id => `https://www.crystallography.net/cod/${id}.html`;
    if (!ids.length) return "";
    if (ids.length === 1) return a(url(ids[0]), "COD", `Crystallography Open Database ${ids[0]}`);
    return `<details class="cod"><summary title="Crystallography Open Database">${esc(t("codN", { n: ids.length }))}</summary>`
      + ids.map(id => a(url(id), id)).join(" ") + "</details>";
  }

  function filtered() {
    const q = $("q").value.trim().toLowerCase();
    const hit = r => `${r.name} ${r.formula} ${r.keywords}`.toLowerCase().includes(q);
    // IXDB では同じ物質（MatVoc ID）のどれか 1 件が一致すれば、その物質の全データベース分を表示
    const mats = state.method === "IXDB" && q ? new Set(state.recs.filter(r => r.mat && hit(r)).map(r => r.mat)) : null;
    return visibleByFacility().filter(r =>
      (!$("edge").value || r.edge === $("edge").value) &&
      (!$("crystal").value || r.crystal === $("crystal").value) &&
      (!$("mtype").value || r.mtype === $("mtype").value) &&
      (!q || hit(r) || (mats && mats.has(r.mat))))
      .sort((x, y) => nm(x).localeCompare(nm(y)) || x.edge.localeCompare(y.edge) || x.crystal.localeCompare(y.crystal) || facLabel(x).localeCompare(facLabel(y)));
  }

  function render() {
    if (state.method === "MATCH") return renderMatch();
    const hx = state.method === "HAXPES", ix = state.method === "IXDB";
    const th = keys => "<tr><th></th>" + keys.map(k => `<th>${esc(t(k))}</th>`).join("") + "</tr>";
    $("thead").innerHTML = hx ? th(["thSample", "thFacBl", "thData"])
      : ix ? th(["thMaterial", "thFormula", "thOrig", "thEdge", "thDb", "thData", "thRel"])
      : th(["thSample", "thFormula", "thEdge", "thCrystal", "thFacBl", "thData"]);
    if (!state.el) { $("rows").innerHTML = ""; if (!state.status.err && state.status.key !== "loading") setStatus("pickElement"); return; }
    const list = filtered();
    const scope = hx ? "" : ix ? (state.facility ? t("scopeOne", { x: scopeLabel() }) : t("scopeAllDb"))
      : state.facility ? t("scopeOne", { x: facLong(state.facility) }) : t("scopeAllFac");
    const mat = ix ? t("mats", { n: new Set(list.map(r => r.mat || r.name)).size }) : "";
    setStatus("count", { src: ix ? "IXDB" : state.method, el: state.el, n: list.length, mat, scope });
    // 関連リンクは同じ物質の 1 行目だけに出す
    const firstOfMat = new Set();
    $("rows").innerHTML = list.map(r => {
      const rel = ix && r.mat && !firstOfMat.has(r.mat) ? (firstOfMat.add(r.mat), relatedHtml(r)) : "";
      return `
      <tr class="${state.cart.has(r.doi) ? "on" : ""}">
        <td><input type="checkbox" data-doi="${esc(r.doi)}" ${state.cart.has(r.doi) ? "checked" : ""} aria-label="${esc(t("select"))}"></td>
        <td>${esc(nm(r))}</td>
        ${ix ? `<td>${esc(r.formula)}</td><td>${esc(r.orig || "")}</td><td class="nw">${esc(r.edge)}</td>`
          : hx ? "" : `<td>${esc(r.formula)}</td><td class="nw">${esc(r.edge)}</td><td class="nw">${esc(r.crystal)}</td>`}
        <td>${esc(facLabel(r))}${r.beamline ? ` / ${esc(r.beamline)}` : ""}</td>
        <td class="links">${linksHtml(r)}</td>
        ${ix ? `<td class="links">${rel}</td>` : ""}
      </tr>`; }).join("") || `<tr><td colspan="8" class="empty">${esc(t("none"))}</td></tr>`;
    markPlotRow();
    document.querySelectorAll("#rows input[type=checkbox]").forEach(cb => cb.onchange = () => {
      const r = state.recs.find(x => x.doi === cb.dataset.doi);
      cb.checked ? state.cart.set(r.doi, r) : state.cart.delete(r.doi);
      render(); renderCart();
    });
  }

  const describe = r => r.method === "HAXPES" ? `HAXPES, ${facLabel(r)} ${r.beamline}` : `${r.edge}, ${r.crystal ? r.crystal + ", " : ""}${facLabel(r)}`;
  function linksHtml(r) {
    const key = plotKey(r);
    const plot = !key ? "" : plotReady(key)
      ? `<button type="button" class="linkbtn" data-plot="${esc(key)}" title="${esc(t("plotTip"))}">${esc(t("plot"))}</button>`
      : `<span class="pending" title="${esc(t("plotMissing"))}">${esc(t("plotPending"))}</span>`;
    if (r.method === "IXDB" && r.db !== "MDR") return `<a href="${esc(r.page)}" target="_blank" rel="noopener">${esc(t("openIn", { db: r.db }))}</a>${plot}`;
    const doi = r.realDoi ?? r.doi;
    // DOI と MDR ページは同じ所に着くので DOI に一本化（DOI が無いときだけ MDR ページへ直接リンク）
    const page = doi
      ? `<a href="https://doi.org/${esc(doi)}" target="_blank" rel="noopener" title="${esc(t("doiTitle", { doi }))}">DOI</a>`
      : `<a href="${esc(r.page)}" target="_blank" rel="noopener">MDR</a>`;
    return `${page}<a href="${esc(r.zip)}">zip</a>${plot}`;
  }

  // ---- スペクトル表示 ----
  // MDR・LISA・XASLIB・CLS はブラウザから直接取得できない (CORS) ため、tools/build_spectra.py・
  // build_haxpes_spectra.py・build_overseas_spectra.py で docs/spectra/ に取り出したものを使う。IHEP は API から直接取得する。
  // プロットの対象を "<DB>:<ID>" で表す（ID の規則は build_overseas_spectra.py の ident と同じ）
  function plotKey(r) {
    const m = (re, s) => (re.exec(s || "") || [])[1] || "";
    const mdr = m(/^https:\/\/mdr\.nims\.go\.jp\/datasets\/([0-9a-f-]{36})$/, r.page);
    if (r.method === "HAXPES") return mdr && `HAXPES:${mdr}`;  // tools/build_haxpes_spectra.py
    if (r.method === "XAFS" || r.db === "MDR") return mdr && `MDR:${mdr}`;
    const id = r.db === "IHEP" ? m(/\/element\/(\d+)/, r.page) : r.db === "LISA" ? m(/\/data\/([^/]+)\.xdi$/, r.page)
      : r.db === "XASLIB" ? m(/\/spectrum\/(\d+)/, r.page) : r.db === "CLS" ? r.wid || "" : "";
    return id && `${r.db}:${id}`;
  }
  // 取り込み済みの ID 一覧（build_spectra.py が作る）。読めないときは全部押せるようにしておく
  let available = null, importInfo = {};
  fetch("spectra/available.json").then(r => r.ok ? r.json() : null).then(d => {
    if (!d) return;
    available = Object.fromEntries(Object.entries(d.ids || d).map(([k, v]) => [k, new Set(v)]));
    importInfo = d.info || {};
    render(); renderCart(); renderFooter();
  }).catch(() => {});
  // ページ下部に出すプロット用スペクトルの取り込み状況（DB ごとの件数と取り込み日）
  function importStatus() {
    const names = { MDR: "MDR XAFS DB", HAXPES: "MDR HAXPES DB" };
    const items = Object.entries(importInfo).filter(([db]) => available?.[db]).map(([db, x]) => t("impItem",
      { db: names[db] || dbName(db), n: available[db].size.toLocaleString(), total: x.total.toLocaleString(), date: x.updated }));
    // 各データの作成日（索引・取り込み・文献値）。どれもスクリプトを実行し直すと更新される
    const dates = [ixdbGenerated() && t("dIxdb", { d: ixdbGenerated() }), mt.indexDate && t("dXanes", { d: mt.indexDate }),
      refE?.generated && t("dRef", { d: refE.generated })].filter(Boolean);
    return (items.length ? `<br><span class="impstat">${esc(t("impStatus", { items: items.join(lang === "ja" ? "、" : "; ") }))}</span>` : "")
      + (dates.length ? `<br><span class="impstat">${esc(t("dataDates", { items: dates.join(lang === "ja" ? "、" : "; ") }))}</span>` : "");
  }
  const plotReady = key => {
    const i = key.indexOf(":"), db = key.slice(0, i);
    return db === "IHEP" || !available || !!available[db]?.has(key.slice(i + 1));
  };
  async function loadSpectrum(key) {
    const [db, id] = [key.slice(0, key.indexOf(":")), key.slice(key.indexOf(":") + 1)];
    const getJson = async url => { const res = await fetch(url); if (!res.ok) throw new Error(res.status === 404 && !url.startsWith("http") ? "missing" : `HTTP ${res.status}`); return res.json(); };
    if (db === "MDR") return getJson(`spectra/${id}.json`);
    if (db !== "IHEP") return getJson(`spectra/${db.toLowerCase()}/${encodeURIComponent(id)}.json`);
    // IHEP の API は CORS を許可しているので直接取得（値は文字列の配列）
    const d = (await getJson(`https://xasdb.ihep.ac.cn/api/spectra/${id}`)).data || {};
    const x = (d.spectra_x || []).map(Number), y = (d.spectra_y || []).map(Number);
    const kind = /fluor/i.test(d.measurement_mode || "") ? "fl" : "mu";
    return { src: "IHEP", live: true, s: x.length > 5 && x.length === y.length ? [{ n: d.file_name || id, t: kind, x, y }] : [] };
  }
  const plot = { rec: null, key: "", data: null, idx: 0, view: "raw", range: "all", err: "", big: false };
  async function openPlot(key) {
    const r = [...state.recs, ...state.cart.values()].find(x => plotKey(x) === key);
    Object.assign(plot, { rec: r, key, data: null, idx: 0, err: "" });
    renderPlot(); markPlotRow();
    $("plot").scrollIntoView({ block: "nearest", behavior: "smooth" });
    try {
      const [data] = await Promise.all([loadSpectrum(key), loadRefEnergies()]);
      if (plot.rec === r) plot.data = data;
    } catch (e) { if (plot.rec === r) plot.err = e.message; }
    if (plot.rec === r) renderPlot();
  }
  // 比べる文献値（tools/build_reference_energies.py）：吸収端は NIST SRD 128、内殻の結合エネルギーは NIST SRD 20 の推奨値（なければ Elam らの表）
  let refE = null;
  const loadRefEnergies = () => refE ? Promise.resolve(refE)
    : fetch("spectra/refenergies.json").then(r => r.ok ? r.json() : {}).then(d => refE = d).catch(() => refE = {});
  // 表示範囲 [x0, x1] にある文献値の線：XAFS は記録の吸収端、HAXPES は領域名の準位（wide は試料の元素と C の主な準位）
  function refMarkers(rec, s, xps, x0, x1) {
    if (!refE) return [];
    const out = [];
    if (!xps) {
      const m = /^([A-Z][a-z]?) (K|L1|L2|L3)-edge$/.exec(rec?.edge || "");
      const e = m && refE.xafs?.[m[1]]?.[m[2]];
      if (e) out.push({ v: e.v, label: `${m[1]} ${m[2]}`, src: e.src });
    } else {
      const m = /^([A-Z][a-z]?) (\d[spdf](?: \d[spdf])*)/.exec(s.n);  // "Pt 5s 4f 5p" のように複数の準位を含む領域もある
      const add = (el, keep) => Object.entries(refE.xps?.[el] || {}).filter(([o, e]) => keep(o, e))
        .forEach(([o, e]) => out.push({ v: e.v, label: `${el} ${o}`, src: e.src }));
      if (m) add(m[1], o => m[2].split(" ").some(n => o.startsWith(n)));
      // wide には表面汚染の C も足す（O の 1s は Elam の表の値が酸化物の実測と 10 eV 以上違うので足さない）
      else if (/^wide$/i.test(s.n)) [...new Set([...(rec?.elements || []), "C"])]
        .forEach(el => add(el, (o, e) => e.v >= 20 && !/1\/2$/.test(o)));
    }
    return out.filter(r => r.v >= x0 && r.v <= x1);
  }
  // 文献値の線のラベルはグラフの邪魔にならないよう、横軸の目盛りの下に並べる。
  // 近いものは横にずらし（線の位置から引き出し線と矢印で結ぶ）、それでも重なるときは段を下げる（最大 3 段）。
  // 収まらないものはラベルを省く（線にマウスを重ねると名前が出る）。左右の端では切れないように寄せる
  function refLabelRows(refs, X, W = 640, L = 74, R = 12) {
    const ends = [], placed = [], gap = 6, maxShift = 90;
    refs.map(r => ({ r, x: X(r.v), w: r.label.length * 8 })).sort((a, b) => a.x - b.x).forEach(p => {
      const lo = L + p.w / 2, hi = W - R - p.w / 2;
      for (let k = 0; k < 3; k++) {
        let tx = Math.min(Math.max(p.x, lo), hi);
        if (k < ends.length && tx - p.w / 2 < ends[k] + gap) tx = ends[k] + gap + p.w / 2;
        if (tx > hi || Math.abs(tx - p.x) > maxShift) continue;
        if (k >= ends.length) ends.push(0);
        ends[k] = tx + p.w / 2;
        placed.push({ ...p, tx, row: k });
        return;
      }
    });
    const arrow = `<defs><marker id="refArrow" viewBox="0 0 6 6" refX="3" refY="0" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,6 L3,0 L6,6 z" style="fill:var(--ref)"/></marker></defs>`;
    return { rows: ends.length, svg: base => (placed.length ? arrow : "") + placed.map(p => {
      const ty = base + 30 + p.row * 18;
      return `<polyline class="refline" points="${p.x},${base + 2} ${p.x},${base + 22} ${p.tx},${ty}" fill="none" style="stroke-dasharray:none;stroke-width:.8" marker-start="url(#refArrow)"/>`
        + `<text class="reflabel" x="${p.tx}" y="${ty + 13}" text-anchor="middle">${esc(p.r.label)}</text>`;
    }).join("") };
  }
  // 画面幅に応じてプロットの置き場所を切り替える（main の 2 列レイアウトと同じ境目）
  const wideMq = matchMedia("(min-width: 981px)");
  const placePlot = () => $(wideMq.matches ? "plotSlotWide" : "plotSlotNarrow").appendChild($("plot"));
  wideMq.addEventListener("change", placePlot);
  placePlot();
  function closePlot() { plot.rec = null; plot.key = ""; plot.big = false; $("plot").hidden = true; $("plot").classList.remove("big"); markPlotRow(); }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && plot.big) { plot.big = false; renderPlot(); } });
  // 表示中のスペクトルの行に色を付ける
  function markPlotRow() {
    document.querySelectorAll("#rows tr").forEach(tr => tr.classList.toggle("plotting",
      !!plot.key && [...tr.querySelectorAll("[data-plot]")].some(b => b.dataset.plot === plot.key)));
  }
  // 一覧と選択中リストの両方にボタンがあるので、まとめて受ける
  document.addEventListener("click", e => { const b = e.target.closest("[data-plot]"); if (b) openPlot(b.dataset.plot); });

  // 簡易の前縁・後縁処理（Athena の考え方に近いもの）：E0 は平滑化した一次微分の最大
  function normalize(x, y) {
    const n = x.length;
    if (n < 8) return null;
    const ys = y.map((v, i) => (y[Math.max(0, i - 1)] + v + y[Math.min(n - 1, i + 1)]) / 3);
    let i0 = 1, best = -Infinity;
    for (let i = 1; i < n - 1; i++) {
      const d = (ys[i + 1] - ys[i - 1]) / (x[i + 1] - x[i - 1]);
      if (d > best) { best = d; i0 = i; }
    }
    const e0 = x[i0];
    const dPre = Math.min(30, 0.35 * (e0 - x[0])), dPost = Math.min(50, 0.3 * (x[n - 1] - e0));
    const sel = f => { const idx = x.map((v, i) => i).filter(i => f(x[i])); return [idx.map(i => x[i]), idx.map(i => y[i])]; };
    let [px, py] = sel(v => v < e0 - dPre);
    if (px.length < 3) [px, py] = [x.slice(0, 3), y.slice(0, 3)];
    let [qx, qy] = sel(v => v > e0 + dPost);
    if (qx.length < 3) [qx, qy] = [x.slice(-3), y.slice(-3)];
    const order = qx[qx.length - 1] - qx[0] > 200 ? 2 : 1;
    const pre = polyfit(px, py, 1), post = polyfit(qx, qy, order);
    const step = polyval(post, e0) - polyval(pre, e0);
    return { e0, pre, post, order, step, y: step > 0 ? y.map((v, i) => (v - polyval(pre, x[i])) / step) : null };
  }
  function polyfit(x, y, order) {
    // 最小二乗（正規方程式）。数値の安定のため x を平均からの差にする
    const m = x.reduce((a, b) => a + b, 0) / x.length, k = order + 1;
    const A = Array.from({ length: k }, () => new Array(k + 1).fill(0));
    x.forEach((xv, i) => {
      const p = Array.from({ length: k }, (_, j) => (xv - m) ** j);
      for (let r = 0; r < k; r++) { for (let c = 0; c < k; c++) A[r][c] += p[r] * p[c]; A[r][k] += p[r] * y[i]; }
    });
    for (let c = 0; c < k; c++)
      for (let r = c + 1; r < k; r++) { const f = A[r][c] / A[c][c]; for (let j = c; j <= k; j++) A[r][j] -= f * A[c][j]; }
    const b = new Array(k).fill(0);
    for (let r = k - 1; r >= 0; r--) { let s = A[r][k]; for (let j = r + 1; j < k; j++) s -= A[r][j] * b[j]; b[r] = s / A[r][r]; }
    return { m, b };
  }
  const polyval = (p, xv) => p.b.reduce((s, c, j) => s + c * (xv - p.m) ** j, 0);

  function niceTicks(lo, hi, count) {
    const raw = (hi - lo || 1) / count, mag = 10 ** Math.floor(Math.log10(raw));
    const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => s >= raw);
    const out = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toPrecision(12));
    return out;
  }

  function renderPlot() {
    const box = $("plot");
    if (!plot.rec) { box.hidden = true; return; }
    box.hidden = false;
    const r = plot.rec;
    const head = `<div class="phead"><h3>${esc(nm(r))} — ${esc([r.edge, r.crystal, facLabel(r) + (r.method === "HAXPES" && r.beamline ? ` ${r.beamline}` : "")].filter(Boolean).join(", "))}</h3>
      <span class="pbtns"><button type="button" class="linkbtn" id="plotBig">${esc(t(plot.big ? "shrink" : "enlarge"))}</button>
      <button type="button" class="linkbtn" id="plotClose">${esc(t("close"))}</button></span></div>`;
    const body = plot.err === "missing" ? `<p class="status">${esc(t("plotMissing"))}</p>`
      : plot.err ? `<p class="status err">${esc(t("plotFail", { msg: plot.err }))}</p>`
      : !plot.data ? `<p class="status">${esc(t("plotLoading"))}</p>`
      : !plot.data.s.length ? `<p class="status">${esc(t("plotNone"))}</p>` : plotBody();
    box.innerHTML = head + body;
    box.classList.toggle("big", plot.big);
    $("plotClose").onclick = closePlot;
    $("plotBig").onclick = () => { plot.big = !plot.big; renderPlot(); };
    box.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { plot.view = b.dataset.view; renderPlot(); });
    box.querySelectorAll("[data-range]").forEach(b => b.onclick = () => { plot.range = b.dataset.range; renderPlot(); });
    if ($("plotSeries")) $("plotSeries").onchange = e => { plot.idx = +e.target.value; renderPlot(); };
  }

  function plotBody() {
    const S = plot.data.s, s = S[Math.min(plot.idx, S.length - 1)];
    // 施設で規格化済みのデータ（立命館の .tey など）と HAXPES はそのまま表示する。HAXPES は横軸が結合エネルギー（右から左へ増える）
    const xps = plot.data.axis === "be", facNorm = s.t === "norm" || xps;
    const nz = facNorm ? null : normalize(s.x, s.y);
    const isNorm = !facNorm && plot.view === "norm" && nz && nz.y;
    const ys = isNorm ? nz.y : s.y;
    let x0 = Math.min(s.x[0], s.x[s.x.length - 1]), x1 = Math.max(s.x[0], s.x[s.x.length - 1]);
    if (plot.range === "xanes" && nz) { x0 = Math.max(x0, nz.e0 - 30); x1 = Math.min(x1, nz.e0 + 70); }
    const idx = s.x.map((v, i) => i).filter(i => s.x[i] >= x0 && s.x[i] <= x1);
    let lo = Math.min(...idx.map(i => ys[i])), hi = Math.max(...idx.map(i => ys[i]));
    const pad = (hi - lo || 1) * 0.06; lo -= pad; hi += pad;
    const refs = refMarkers(plot.rec, s, xps, x0, x1);
    const W = 640, L = 74, R = 12, T = 10;
    const X0 = v => L + (xps ? x1 - v : v - x0) / (x1 - x0 || 1) * (W - L - R);
    const lab = refLabelRows(refs, X0), B = 50 + (lab.rows ? 12 + lab.rows * 18 : 0), H = 260 + B;
    const X = X0, Y = v => T + (hi - v) / (hi - lo || 1) * (H - T - B);
    // 大きな値（HAXPES の計数など）は k・M を付けて短くする
    const fmtY = v => Math.abs(v) >= 1e6 ? `${+(v / 1e6).toPrecision(3)}M` : Math.abs(v) >= 1e3 ? `${+(v / 1e3).toPrecision(3)}k` : +v.toPrecision(4);
    const line = pts => pts.map(([a, b], k) => `${k ? "L" : "M"}${X(a).toFixed(1)},${Y(b).toFixed(1)}`).join("");
    const fit = (p, a, b) => line(Array.from({ length: 41 }, (_, k) => { const v = a + (b - a) * k / 40; return [v, polyval(p, v)]; }));
    const showFit = !isNorm && nz && nz.y;
    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(nm(plot.rec))}">
      <defs><clipPath id="pc"><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}"/></clipPath></defs>
      ${niceTicks(x0, x1, 6).map(v => `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H - B}"/><text x="${X(v)}" y="${H - B + 4}" dy="1em" text-anchor="middle">${v}</text>`).join("")}
      ${niceTicks(lo, hi, 5).map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 5}" y="${Y(v)}" dy=".35em" text-anchor="end">${fmtY(v)}</text>`).join("")}
      <line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H - B}"/><line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
      <g clip-path="url(#pc)">
        ${showFit ? `<path class="fit" d="${fit(nz.pre, x0, nz.e0 + 20)}"/><path class="fit" d="${fit(nz.post, nz.e0 - 20, x1)}"/>` : ""}
        ${nz && nz.e0 >= x0 && nz.e0 <= x1 ? `<line class="e0" x1="${X(nz.e0)}" x2="${X(nz.e0)}" y1="${T}" y2="${H - B}"/>` : ""}

  // ---- XANES 類似検索 ----
  // 索引（tools/build_xanes_index.py）は元素・吸収端ごとに、規格化・平坦化した XANES を Ec−30〜Ec+70 eV の 0.5 eV 格子に載せたもの。
  // DB 側は施設ごとに金属箔の半値エネルギーを基準値 eh にそろえてある。測定データも normalizeXanes
  // （build_xanes_index.py の normalize_xanes と同じ手順）で規格化し、測定したリファレンスの半値エネルギーを eh に合わせて比べる。
  const mt = { index: null, data: null, edge: "", crystal: "", scope: "", top: 10, sample: null, ref: null, useInFileRef: false,
    cfg: { e: 0, mode: "col", y: 1, a: 1, b: 2 }, fac: "", fine: 0, win: "-20,50", selKey: "", results: null, sel: 0, view: "mu", sortBy: "total", err: "" };
  const M_WIN = [-200, 400], M_E0 = 30;

  function normalizeXanes(x0, y0, ec) {
    const pts = x0.map((v, i) => [v, y0[i]]).filter(([v, w]) => v >= ec + M_WIN[0] && v <= ec + M_WIN[1] && Number.isFinite(w));
    if (pts.length < 8) return null;
    const x = pts.map(p => p[0]), y = pts.map(p => p[1]), n = x.length;
    const ys = y.map((v, i) => (y[Math.max(0, i - 1)] + v + y[Math.min(n - 1, i + 1)]) / 3);
    let i0 = -1, best = -Infinity;
    for (let i = 1; i < n - 1; i++) {
      if (Math.abs(x[i] - ec) > M_E0 || x[i + 1] === x[i - 1]) continue;
      const d = (ys[i + 1] - ys[i - 1]) / (x[i + 1] - x[i - 1]);
      if (d > best) { best = d; i0 = i; }
    }
    if (i0 < 0) return null;
    const e0 = x[i0], dPre = Math.min(30, 0.35 * (e0 - x[0])), dPost = Math.min(50, 0.3 * (x[n - 1] - e0));
    let pre = x.map((v, i) => i).filter(i => x[i] < e0 - dPre), post = x.map((v, i) => i).filter(i => x[i] > e0 + dPost);
    if (pre.length < 3) pre = [0, 1, 2];
    if (post.length < 3) post = [n - 3, n - 2, n - 1];
    const order = x[post[post.length - 1]] - x[post[0]] > 200 ? 2 : 1;
    const pp = polyfit(pre.map(i => x[i]), pre.map(i => y[i]), 1), qp = polyfit(post.map(i => x[i]), post.map(i => y[i]), order);
    const step = polyval(qp, e0) - polyval(pp, e0);
    if (!(step > 0)) return null;
    const yn = x.map((v, i) => (y[i] - polyval(pp, v)) / step - (v >= e0 ? (polyval(qp, v) - polyval(pp, v) - step) / step : 0));
    // 半値エネルギー（規格化 μ が 0.5 になるエネルギー）：リファレンスの位置合わせに使う
    let eh = null;
    for (let i = 1; i < n; i++) {
      if (yn[i - 1] < 0.5 && yn[i] >= 0.5 && x[i] <= e0 + M_E0) {
        eh = x[i - 1] + (0.5 - yn[i - 1]) / (yn[i] - yn[i - 1]) * (x[i] - x[i - 1]);
        if (x[i] >= e0) break;
      }
    }
    return { e0, eh, step, x, y: yn };
  }
  function onGrid(x, y, ec, grid) {
    const out = [];
    let j = 0;
    for (let g = grid[0]; g <= grid[1] + 1e-9; g += grid[2]) {
      const e = ec + g;
      while (j < x.length - 2 && x[j + 1] < e) j++;
      out.push(e >= x[0] && e <= x[x.length - 1] && x[j + 1] !== x[j] ? y[j] + (e - x[j]) / (x[j + 1] - x[j]) * (y[j + 1] - y[j]) : null);
    }
    return out;
  }

  // ファイルの読み取り：PF9809（.dat）または数値の表（2 列、Athena、XDI など）
  function parseSpectrumFile(name, text) {
    const lines = text.split(/\r?\n/);
    if (/^\s*9809\b/.test(lines[0] || "")) {
      const dm = /D=\s*([\d.]+)/.exec(text), im = lines.findIndex(l => /^\s*Mode\b/.test(l));
      if (!dm || im < 0) return null;
      const D = +dm[1], det = (lines[5] || "").slice(10, 40), modes = [0, ...lines[im].trim().split(/\s+/).slice(1).map(Number)];
      const offs = [0, ...lines[im + 1].trim().split(/\s+/).slice(1).map(Number)];
      const rows = lines.slice(im + 2).map(l => l.trim().split(/\s+/).map(Number)).filter(r => r.length >= modes.length && r.every(Number.isFinite));
      const E = rows.map(r => 12398.42 / (2 * D * Math.sin((r[1] || r[0]) * Math.PI / 180)));
      const ch = k => rows.map(r => r[k] - offs[k] * r[2]);
      const idx = m => modes.map((v, k) => k >= 3 && m(v) ? k : -1).filter(k => k >= 0);
      const i0 = idx(v => v === 1)[0], tr = idx(v => v === 2), fl = idx(v => v >= 3);
      if (i0 == null) return null;
      const I0 = ch(i0), ln = (a, b) => a.map((v, i) => v > 0 && b[i] > 0 ? Math.log(v / b[i]) : NaN);
      const fluo = /fluo/i.test(det) && fl.length;
      const y = fluo ? I0.map((v, i) => fl.reduce((s, k) => s + ch(k)[i], 0) / v) : tr.length ? ln(I0, ch(tr[0])) : null;
      if (!y) return null;
      return { name, kind: "pf", x: E, y, refY: !fluo && tr.length > 1 ? ln(ch(tr[0]), ch(tr[1])) : null };
    }
    let names = [];
    const xdi = lines.map(l => /^#\s*Column\.(\d+):\s*(\S+)/.exec(l)).filter(Boolean);
    if (xdi.length) xdi.forEach(m => names[+m[1] - 1] = m[2]);
    const rows = [];
    let lastComment = "";
    for (const l of lines) {
      if (/^\s*[#!;%]/.test(l)) { lastComment = l.replace(/^\s*[#!;%]+/, ""); continue; }
      const r = l.trim().split(/[\s,;]+/).map(Number);
      if (r.length >= 2 && r.every(Number.isFinite)) rows.push(r);
      else if (!rows.length && /[A-Za-z]/.test(l)) lastComment = l;
    }
    if (rows.length < 8) return null;
    const nc = Math.min(...rows.map(r => r.length));
    if (!names.length) names = lastComment.trim().split(/[\s,;\t]+/).length === nc ? lastComment.trim().split(/[\s,;\t]+/) : [];
    names = Array.from({ length: nc }, (_, i) => names[i] || `${i + 1}`);
    const cols = names.map((_, i) => rows.map(r => r[i]));
    if (Math.max(...cols[0]) < 100) cols[0] = cols[0].map(v => v * 1000);  // keV → eV
    return { name, kind: "table", names, cols };
  }
  // 表の列の初期設定：μ の列があればそれ、I0 と It があれば ln(I0/It)、If と I0 があれば If/I0
  function guessCols(names) {
    const f = re => names.findIndex(n => re.test(n));
    const mu = f(/^(mu|xmu|mutrans|mufluor|norm|flat|absorption|mu_?t)/i), i0 = f(/^i0/i), it = f(/^(itrans|it|i1)\b/i), ifl = f(/^(ifluor|if|fluor|pfy|tey)/i);
    if (names.length === 2) return { e: 0, mode: "col", y: 1, a: 1, b: 1 };
    if (mu > 0) return { e: 0, mode: "col", y: mu, a: 1, b: 2 };
    if (i0 > 0 && it > 0) return { e: 0, mode: "ln", y: 1, a: i0, b: it };
    if (i0 > 0 && ifl > 0) return { e: 0, mode: "ratio", y: 1, a: ifl, b: i0 };
    return { e: 0, mode: "col", y: 1, a: 1, b: 2 };
  }
  function seriesOf(p) {
    if (!p) return null;
    if (p.kind === "pf") return { x: p.x, y: p.y };
    const c = mt.cfg, A = p.cols[c.a], B = p.cols[c.b];
    const y = c.mode === "ln" ? A.map((v, i) => v > 0 && B[i] > 0 ? Math.log(v / B[i]) : NaN)
      : c.mode === "ratio" ? A.map((v, i) => B[i] ? v / B[i] : NaN) : p.cols[c.y];
    const pts = p.cols[c.e].map((v, i) => [v, y[i]]).filter(q => Number.isFinite(q[0]) && Number.isFinite(q[1])).sort((u, v) => u[0] - v[0]);
    return { x: pts.map(q => q[0]), y: pts.map(q => q[1]) };
  }

  async function selectMatchElement(sym) {
    const edges = Object.keys(mt.index || {}).filter(k => k.startsWith(sym + "_")).map(k => k.split("_")[1]);
    mt.edge = edges.includes(mt.edge) ? mt.edge : ["K", "L3", "L2", "L1"].find(e => edges.includes(e)) || "";
    await loadMatchData();
  }
  async function loadMatchData() {
    Object.assign(mt, { data: null, results: null, err: "" });
    renderMatch();
    if (!state.el || !mt.edge) return;
    const want = `${state.el}_${mt.edge}`;
    try {
      const [d] = await Promise.all([fetch(`spectra/xanes/${want}.json`).then(r => r.json()), loadRefEnergies()]);
      if (`${state.el}_${mt.edge}` === want) mt.data = d;
    } catch (e) { mt.err = e.message; }
    renderMatch();
  }
  const srcLabel = it => it.db === "MDR" ? `${facShort(it.fac) || it.fac}${it.bl ? " " + it.bl : ""}` : dbName(it.db);
  const inScope = it => (!mt.scope || (mt.scope.startsWith("MDR|") ? it.db === "MDR" && it.fac === mt.scope.slice(4) : it.db === mt.scope))
    && (!mt.crystal || it.c === mt.crystal);
  // 補正量 = 基準（測定したリファレンス → 基準値、なければ選んだ施設の代表値、どちらもなければ 0）+ 微調整
  function currentOffset() {
    const d = mt.data, fine = +mt.fine || 0;
    const rs = mt.useInFileRef && mt.sample?.refY ? { x: mt.sample.x, y: mt.sample.refY } : seriesOf(mt.ref);
    const nz = d && d.eh && rs ? normalizeXanes(rs.x, rs.y, d.ec) : null;
    const base = nz && nz.eh ? { base: d.eh - nz.eh, how: "ref", u: nz.eh, d: d.eh }
      : d && mt.fac && d.src?.[mt.fac] != null ? { base: d.src[mt.fac], how: "fac" } : { base: 0, how: "none" };
    return { ...base, fine, o: base.base + fine };
  }
  const facKeyLabel = k => { const [db, fac, c] = k.split("|"); return (db === "MDR" ? `MDR: ${facShort(fac) || fac}` : dbName(db)) + (c ? ` ${c}` : ""); };

  function rankOf(vals, higherBetter) {
    const idx = vals.map((v, i) => i).sort((a, b) => higherBetter ? vals[b] - vals[a] : vals[a] - vals[b]);
    const r = new Array(vals.length);
    idx.forEach((i, k) => r[i] = k + 1);
    return r;
  }
  function pearson(a, b) {
    const n = a.length, ma = a.reduce((s, v) => s + v, 0) / n, mb = b.reduce((s, v) => s + v, 0) / n;
    let sab = 0, saa = 0, sbb = 0;
    for (let i = 0; i < n; i++) { const da = a[i] - ma, db = b[i] - mb; sab += da * db; saa += da * da; sbb += db * db; }
    return saa && sbb ? sab / Math.sqrt(saa * sbb) : 0;
  }
  const ranks = a => rankOf(a, false);
  const deriv = a => a.slice(1).map((v, i) => v - a[i]);
  // win：比較に使う格子の番号。両方にデータのある点が範囲の 60% 未満なら比べない（測定範囲が狭い・ずれているもの）
  function metrics(u, v, win) {
    const ia = win.filter(i => u[i] != null && v[i] != null);
    if (ia.length < win.length * 0.6) return null;
    const a = ia.map(i => u[i]), b = ia.map(i => v[i]);
    const dot = a.reduce((s, x, i) => s + x * b[i], 0), na = Math.hypot(...a), nb = Math.hypot(...b);
    const pa = a.map(x => Math.max(0, x)), pb = b.map(x => Math.max(0, x));
    return {
      pearson: pearson(a, b), deriv: pearson(deriv(a), deriv(b)), cos: na && nb ? dot / (na * nb) : 0,
      spear: pearson(ranks(a), ranks(b)),
      rf: a.reduce((s, x, i) => s + (x - b[i]) ** 2, 0) / a.reduce((s, x) => s + x * x, 0),
      ruz: pa.reduce((s, x, i) => s + Math.min(x, pb[i]), 0) / pa.reduce((s, x, i) => s + Math.max(x, pb[i]), 0),
      ov: ia.length / win.length,
    };
  }
  const M_KEYS = [["pearson", "mPearson", true], ["deriv", "mDeriv", true], ["cos", "mCos", true], ["spear", "mSpear", true], ["rf", "mRf", false], ["ruz", "mRuz", true]];

  function runMatch() {
    const d = mt.data, s = seriesOf(mt.sample);
    mt.results = null; mt.err = "";
    if (!d || !s) return;
    const off = currentOffset();
    const nz = normalizeXanes(s.x.map(v => v + off.o), s.y, d.ec);
    if (!nz) { mt.err = t("mNoEdge", { ec: d.ec }); return; }
    const u = onGrid(nz.x, nz.y, d.ec, d.grid);
    const [wlo, whi] = mt.win.split(",").map(Number);
    const win = u.map((v, i) => i).filter(i => { const g = d.grid[0] + i * d.grid[2]; return g >= wlo - 1e-9 && g <= whi + 1e-9; });
    const rows = d.items.filter(inScope).map(it => ({ it, m: metrics(u, it.y, win) })).filter(r => r.m);
    if (rows.length) {
      const rk = M_KEYS.map(([k, , hb]) => rankOf(rows.map(r => r.m[k]), hb));
      rows.forEach((r, i) => r.m.total = rk.reduce((s, x) => s + x[i], 0) / rk.length);
    }
    mt.results = { u, nz, off, rows, wlo, whi };
    sortResults();
    // 微調整などで計算し直しても、選んでいた候補が上位にあれば選んだままにする
    const k = rows.slice(0, mt.top).findIndex(r => r.it.k === mt.selKey);

  }
